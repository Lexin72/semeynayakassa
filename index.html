<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Семейная касса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9CB5AD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Касса">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
  :root{
    --teal:#9CB5AD;
    --teal-dark:#8BA79E;
    --cream:#EDE4D0;
    --cream-soft:#F2EBDB;
    --cream-row:#E0DAC8;
    --brown:#7A3D0A;
    --brown-deep:#5C2E06;
    --brown-mid:#8B4A12;
    --ink:#4A2A0C;
    --ink-soft:#8A6A47;
    --cream-text:#F5EEDC;
    --tan:#C9A876;
    --rust:#A8442C;
    --paper:#F2EBDB;
    --bg-deep:var(--teal);
    --bg-panel:var(--cream);
    --bg-panel-2:var(--cream-soft);
    --gold:var(--brown);
    --gold-soft:var(--brown);
    --cat-1:#7C9473; --cat-2:#5B7FA6; --cat-3:#A8442C; --cat-4:#C9A876;
    --cat-5:#8C5B7A; --cat-6:#6B7280; --cat-7:#4E8C82; --cat-8:#A65D8E;
    --spring:cubic-bezier(.34,1.56,.64,1);
    --ease:cubic-bezier(.4,0,.2,1);
    --font-display:'Playfair Display', serif;
    --font-head:'Inter', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--teal);color:var(--ink);font-family:var(--font-body);min-height:100vh;
    -webkit-font-smoothing:antialiased;}
  .app{max-width:1120px;margin:0 auto;padding:0 0 110px;}

  /* ================= ШАПКА ================= */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 10px;flex-wrap:wrap;}
  .brand{position:relative;line-height:1;flex-shrink:0;}
  .brand .b-top{font-family:var(--font-display);font-weight:900;font-size:30px;letter-spacing:0.02em;
    color:var(--cream-text);text-transform:uppercase;display:block;
    -webkit-text-stroke:1.5px rgba(92,46,6,0.55);}
  .brand .b-bot{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:30px;
    color:var(--brown);text-transform:uppercase;display:block;margin:-14px 0 0 26px;letter-spacing:0.01em;}

  .page-tabs{display:flex;background:var(--cream-soft);border-radius:999px;padding:4px;gap:2px;}
  .page-tabs button{border:none;background:transparent;color:var(--brown);font-family:var(--font-body);
    font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:8px 18px;
    border-radius:999px;cursor:pointer;transition:background .2s var(--ease), color .2s var(--ease);white-space:nowrap;}
  .page-tabs button.active{background:var(--brown);color:var(--cream-text);}

  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .member-pill-group{display:flex;background:var(--cream-soft);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap;}
  .member-chip{display:flex;align-items:center;gap:5px;padding:8px 14px;border-radius:999px;font-size:12px;
    font-weight:700;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;color:var(--brown);
    background:transparent;transition:background .2s var(--ease), color .2s var(--ease);white-space:nowrap;}
  .member-chip.active{background:var(--brown);color:var(--cream-text);}
  .avatar{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:8px;font-weight:700;color:var(--cream-text);flex-shrink:0;background:var(--brown-deep);}
  .avatar-photo{background-size:cover;background-position:center;}
  .edit-profile-btn{display:none;}
  .member-switch-btn{display:none;}

  /* ================= ПОЛОСА ПЕРИОДА + ЛУЖА ================= */
  .period-band{position:relative;background:var(--cream);padding:14px 20px;display:flex;
    align-items:center;justify-content:space-between;gap:12px;margin-bottom:0;}
  .wheel{display:flex;align-items:baseline;gap:5px;flex-shrink:0;}
  .wheel-arrow{background:transparent;border:none;color:var(--ink-soft);font-size:19px;cursor:pointer;
    padding:0 2px;line-height:1;transition:color .15s ease, transform .15s var(--spring);flex-shrink:0;}
  .wheel-arrow:hover{color:var(--brown);transform:scale(1.2);}
  .wheel-peek{font-family:var(--font-head);font-weight:600;font-size:13px;color:rgba(122,61,10,0.38);
    text-transform:uppercase;white-space:nowrap;}
  .wheel-main{font-family:var(--font-head);font-weight:800;font-size:26px;color:var(--brown-deep);
    text-transform:uppercase;white-space:nowrap;display:inline-block;}
  @keyframes wheelRoll{0%{opacity:0;transform:translateY(60%);}100%{opacity:1;transform:translateY(0);}}
  .wheel-main.rolling{animation:wheelRoll .35s var(--spring) both;}

  .puddle-slot{position:absolute;left:50%;top:-34px;transform:translateX(-50%);z-index:5;}
  .oil-puddle{position:relative;width:300px;height:112px;display:flex;align-items:center;justify-content:center;
    cursor:default;overflow:hidden;
    background:
      radial-gradient(ellipse 60% 70% at 22% 35%, rgba(245,238,220,0.85), transparent 60%),
      radial-gradient(ellipse 55% 65% at 78% 65%, rgba(122,61,10,0.75), transparent 60%),
      linear-gradient(115deg, #6E3B10 0%, #B98B4E 14%, #EFE4CC 27%, #9FB5AC 38%, #7A3D0A 50%,
        #D6B98A 62%, #F3ECD8 72%, #8FA9A0 84%, #6E3B10 100%);
    background-size:200% 200%, 200% 200%, 320% 320%;
    animation: blobMorph 14s ease-in-out infinite, oilFlow 11s ease-in-out infinite;
    border-radius:48% 52% 60% 40% / 52% 44% 56% 48%;
    box-shadow:0 8px 24px rgba(60,35,10,0.32), inset 0 2px 14px rgba(255,255,255,0.28);
    filter:saturate(1.15);}
  @keyframes blobMorph{
    0%   {border-radius:48% 52% 60% 40% / 52% 44% 56% 48%;}
    20%  {border-radius:58% 42% 44% 56% / 44% 58% 42% 56%;}
    40%  {border-radius:42% 58% 56% 44% / 58% 40% 60% 42%;}
    60%  {border-radius:53% 47% 38% 62% / 46% 54% 46% 54%;}
    80%  {border-radius:45% 55% 58% 42% / 56% 46% 54% 44%;}
    100% {border-radius:48% 52% 60% 40% / 52% 44% 56% 48%;}
  }
  @keyframes oilFlow{
    0%   {background-position:0% 50%, 100% 50%, 0% 50%;}
    50%  {background-position:100% 50%, 0% 50%, 100% 50%;}
    100% {background-position:0% 50%, 100% 50%, 0% 50%;}
  }
  .oil-number{font-family:var(--font-head);font-weight:800;font-size:40px;color:var(--cream-text);
    letter-spacing:0.01em;position:relative;z-index:2;
    text-shadow:0 2px 10px rgba(50,28,6,0.55), 0 0 22px rgba(255,255,255,0.22);
    transition:opacity .45s var(--ease), filter .45s var(--ease), transform .45s var(--ease);}
  .oil-number.dissolving{opacity:0;filter:blur(10px);transform:scale(0.82);}

  /* ================= КРЕМОВАЯ ПАНЕЛЬ: ГРАФИК + ТОП5 ================= */
  .cream-panel{background:var(--cream-soft);padding:22px 20px 16px;display:grid;
    grid-template-columns:1.55fr 1fr;gap:26px;align-items:start;}
  @media (max-width:760px){.cream-panel{grid-template-columns:1fr;gap:20px;padding-top:44px;}}
  .daychart-head{font-family:var(--font-head);font-weight:800;font-size:19px;color:var(--brown-deep);
    text-align:center;min-height:26px;margin-bottom:8px;}
  .day-bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:2px solid var(--brown);
    border-left:2px solid var(--brown);padding:0 2px 0 4px;}
  .day-bar-col{flex:1;display:flex;align-items:flex-end;justify-content:center;height:100%;min-width:2px;cursor:pointer;}
  .day-bar{width:55%;min-width:3px;background:var(--brown);min-height:2px;transform-origin:bottom;
    animation:barGrow .5s var(--spring) both;transition:width .2s var(--spring), background .2s ease;}
  .day-bar-col:hover .day-bar{background:var(--brown-mid);}
  .day-bar-col.selected .day-bar{width:100%;background:var(--brown-deep);}
  @keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  .day-bar-labels{display:flex;gap:2px;padding:4px 2px 0 4px;}
  .day-bar-labels span{flex:1;text-align:center;font-size:8px;font-weight:700;color:var(--ink-soft);min-width:2px;}

  .top5-title{font-family:var(--font-display);font-weight:900;font-size:26px;color:var(--brown-deep);
    text-align:center;margin:0 0 12px;text-transform:uppercase;letter-spacing:0.02em;}
  .top5-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:1px 0;}
  .top5-name{font-size:14px;font-weight:700;color:var(--brown-deep);text-transform:lowercase;}
  .top5-amt{font-size:12.5px;font-style:italic;color:var(--ink-soft);font-variant-numeric:tabular-nums;}

  /* ================= КАЛЕНДАРЬ + ПОНЧИК ================= */
  .cal-donut-wrap{padding:16px 18px 6px;}
  .cal-donut-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;
    background:var(--cream-soft);border-radius:18px;padding:16px;}
  @media (max-width:760px){.cal-donut-row{grid-template-columns:1fr;gap:22px;}}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:5px;}
  .cal-weekdays span{font-size:8.5px;text-align:center;color:var(--ink-soft);font-weight:700;
    text-transform:uppercase;letter-spacing:0.04em;}
  .cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-day{aspect-ratio:1;background:var(--brown);display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:13px;font-weight:700;color:var(--cream-text);border:none;
    transition:transform .15s var(--spring), background .15s ease;}
  .cal-day:hover{transform:translateY(-2px);background:var(--brown-mid);}
  .cal-day.empty{visibility:hidden;cursor:default;}
  .cal-day.no-expense{background:var(--brown);opacity:0.78;}
  .cal-day.selected{background:var(--cream-soft) !important;color:var(--brown-deep) !important;opacity:1;}
  .cal-day.today:not(.selected){box-shadow:inset 0 0 0 2px var(--cream-soft);}

  .donut-col{display:flex;flex-direction:column;align-items:center;}
  .donut-row{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap;}
  .donut-svg-wrap{position:relative;width:150px;height:150px;flex-shrink:0;}
  .donut-svg-wrap svg{animation:donutIn .45s var(--spring) both;}
  @keyframes donutIn{from{opacity:0;transform:scale(.88) rotate(-10deg);}to{opacity:1;transform:scale(1) rotate(0);}}
  .donut-total{font-family:var(--font-head);font-weight:800;font-size:26px;color:var(--brown-deep);
    text-align:center;margin-top:10px;font-variant-numeric:tabular-nums;}
  .pie-legend{min-width:120px;}
  .pie-legend-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:1px 0;}
  .pie-legend-name{display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;
    color:var(--brown-deep);text-transform:lowercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pie-legend-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .pie-legend-amt{font-size:12px;font-style:italic;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex-shrink:0;}
  .pie-empty{color:var(--ink-soft);font-style:italic;font-size:13px;text-align:center;padding:26px 0;}

  /* ================= СПИСОК ТРАТ ================= */
  .tape-wrap{padding:6px 18px 0;}
  .tape{display:flex;flex-direction:column;gap:7px;}
  .day-group{margin-bottom:8px;}
  .day-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;
    color:var(--brown-deep);text-transform:uppercase;letter-spacing:0.06em;margin:12px 4px 7px;}
  .day-total-amt{font-style:italic;font-weight:700;color:var(--brown);text-transform:none;letter-spacing:0;font-size:12.5px;}
  @keyframes riseIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .receipt{background:var(--cream-row);border-radius:999px;padding:11px 8px 11px 22px;display:flex;
    align-items:center;gap:10px;cursor:pointer;position:relative;animation:riseIn .3s var(--ease) both;
    transition:background .15s ease, transform .15s var(--ease);}
  .receipt:hover{background:var(--cream-soft);transform:translateX(3px);}
  .receipt::before{display:none;}
  .receipt-dot{display:none;}
  .receipt-main{flex:1;min-width:0;}
  .receipt-cat{font-size:15px;font-weight:600;color:var(--brown-deep);text-transform:lowercase;}
  .receipt-note{font-size:11.5px;color:var(--ink-soft);margin-top:1px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .receipt-tail{display:flex;align-items:center;gap:14px;background:var(--cream-soft);border-radius:999px;
    padding:7px 18px 7px 16px;flex-shrink:0;min-width:180px;justify-content:space-between;}
  @media (max-width:520px){.receipt-tail{min-width:auto;gap:10px;padding:6px 12px;}}
  .receipt-member{font-size:11.5px;font-weight:700;color:var(--brown-deep);text-transform:uppercase;letter-spacing:0.03em;}
  .receipt-amount{font-size:13px;font-style:italic;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .empty-tape{padding:32px 20px;text-align:center;color:var(--ink-soft);font-style:italic;
    background:var(--cream-soft);border-radius:18px;}

  /* ================= ПЛАВАЮЩИЕ КНОПКИ ================= */
  .profile-fab{position:fixed;bottom:26px;left:26px;width:56px;height:56px;border-radius:50%;
    background:var(--brown);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(60,35,10,0.35);transition:transform .2s var(--spring);z-index:30;}
  .profile-fab:hover{transform:scale(1.08);}
  .profile-fab svg{width:28px;height:28px;}
  .fab{position:fixed;bottom:26px;right:26px;width:58px;height:58px;border-radius:16px;
    background:var(--cream-soft);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(60,35,10,0.32);transition:transform .25s var(--spring);z-index:30;}
  .fab:hover{transform:scale(1.08) rotate(90deg);}
  .fab:active{transform:scale(0.94);}
  .fab svg{width:30px;height:30px;}

  /* ================= БЮДЖЕТ ================= */
  .budget-wrap{margin:0 18px 8px;background:var(--cream-soft);border-radius:16px;padding:12px 16px;
    cursor:pointer;transition:filter .15s ease;}
  .budget-wrap:hover{filter:brightness(1.03);}
  .budget-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;}
  .budget-label{color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;font-size:10px;font-weight:700;}
  .budget-nums{font-size:12.5px;color:var(--brown-deep);font-weight:600;font-variant-numeric:tabular-nums;}
  .budget-track{height:8px;border-radius:5px;background:rgba(122,61,10,0.14);overflow:hidden;}
  .budget-fill{height:100%;border-radius:5px;width:0;transition:width .8s var(--ease), background .3s ease;}
  .budget-fill.ok{background:linear-gradient(90deg,#7C9473,#9fc492);}
  .budget-fill.warn{background:linear-gradient(90deg,var(--tan),#e3c894);}
  .budget-fill.over{background:linear-gradient(90deg,var(--rust),#d27b60);}
  .budget-note{font-size:11px;margin-top:7px;color:var(--ink-soft);}
  .budget-note.over{color:var(--rust);font-weight:600;}
  .budget-empty{font-size:12px;color:var(--ink-soft);font-style:italic;}

  /* ================= ПОИСК ================= */
  .tape-toolbar{display:flex;gap:8px;align-items:center;margin:10px 0 4px;}
  .search-input{flex:1;min-width:0;background:var(--cream-soft);border:none;color:var(--brown-deep);
    border-radius:999px;padding:11px 18px;font-family:var(--font-body);font-size:13px;outline:none;}
  .search-input::placeholder{color:var(--ink-soft);opacity:0.7;}
  .search-clear{background:var(--cream-soft);border:none;color:var(--brown);border-radius:50%;
    width:34px;height:34px;cursor:pointer;flex-shrink:0;font-size:14px;}
  .search-count{font-size:11.5px;color:var(--ink-soft);margin:4px 6px 8px;font-style:italic;}
  .swipe-hint{text-align:center;font-size:10px;color:rgba(74,42,12,0.3);margin:6px 0 2px;letter-spacing:0.04em;}
  @media (min-width:761px){.swipe-hint{display:none;}}

  /* ================= МОДАЛЬНЫЕ ОКНА ================= */
  .overlay{position:fixed;inset:0;background:rgba(74,42,12,0.42);backdrop-filter:blur(3px);display:flex;
    align-items:center;justify-content:center;z-index:50;padding:16px;animation:fadeIn .18s var(--ease) both;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes modalPop{from{opacity:0;transform:scale(.94) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal{background:var(--cream-soft);color:var(--ink);border-radius:26px;padding:26px 28px;width:100%;
    max-width:430px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    box-shadow:0 22px 50px rgba(50,28,6,0.35);animation:modalPop .28s var(--spring) both;}
  .modal h2{font-family:var(--font-display);font-weight:900;font-size:27px;margin:0 0 14px;text-align:center;
    text-transform:uppercase;letter-spacing:0.02em;color:var(--brown-deep);}
  .modal label{display:block;font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--brown-deep);
    margin:18px 0 9px;text-transform:uppercase;letter-spacing:0.03em;text-align:center;}
  .amount-input{width:100%;font-family:var(--font-head);font-size:30px;font-weight:800;border:none;
    border-bottom:2px solid var(--brown);background:transparent;padding:4px 0 6px;color:var(--brown-deep);
    outline:none;text-align:center;}
  .modal input[type=text], .modal input[type=date]{width:100%;padding:11px 16px;border-radius:999px;
    border:1.5px solid var(--brown);font-family:var(--font-body);font-size:13.5px;background:transparent;
    color:var(--brown-deep);outline:none;}
  .modal input[type=text]::placeholder{color:var(--ink-soft);opacity:.65;}
  .chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  @media (max-width:420px){.chip-grid{grid-template-columns:repeat(2,1fr);}}
  .chip{padding:9px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.03em;cursor:pointer;border:1.5px solid var(--brown);background:var(--brown);
    color:var(--cream-text);display:flex;align-items:center;justify-content:center;gap:5px;text-align:center;
    transition:transform .15s var(--spring), background .15s ease, color .15s ease;}
  .chip:hover{transform:translateY(-1px);}
  .chip.selected{background:var(--brown-deep);border-color:var(--brown-deep);
    box-shadow:0 0 0 2px rgba(92,46,6,0.22);}
  .chip-dot{display:none;}
  .add-cat-chip{background:transparent;color:var(--brown);border:1.5px solid var(--brown);}
  .member-seg{display:flex;justify-content:center;}
  .member-seg-inner{display:flex;background:var(--brown);border-radius:999px;padding:0;overflow:hidden;}
  .member-seg .chip{border-radius:0;border:none;background:transparent;color:var(--cream-text);
    padding:9px 16px;box-shadow:none;}
  .member-seg .chip.selected{background:var(--brown-deep);box-shadow:none;}
  .member-seg .chip:first-child{border-radius:999px 0 0 999px;}
  .member-seg .chip:last-child{border-radius:0 999px 999px 0;}
  .modal-actions{display:flex;gap:12px;margin-top:26px;justify-content:center;position:sticky;bottom:-26px;
    background:var(--cream-soft);padding:14px 0 4px;}
  .btn{flex:1;max-width:170px;padding:12px;border-radius:999px;border:1.5px solid var(--brown);
    font-family:var(--font-display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:0.03em;
    cursor:pointer;transition:transform .15s var(--ease), filter .15s ease;}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
  .btn-primary{background:var(--brown);color:var(--cream-text);}
  .btn-secondary{background:transparent;color:var(--brown-deep);}
  .btn-danger{background:var(--rust);color:#fff;border-color:var(--rust);}
  .modal-error{color:var(--rust);font-size:12.5px;margin-top:10px;min-height:16px;text-align:center;}
  .btn[disabled]{opacity:.6;cursor:default;pointer-events:none;}
  .btn.loading{position:relative;color:transparent !important;}

function animateCountUp(el, endValue, formatFn, duration){
  duration = duration || 650;
  const startTime = performance.now();
  function step(now){
    const t = Math.min((now-startTime)/duration, 1);
    const eased = 1 - Math.pow(1-t, 3);

function resizeImageToDataUrl(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('image failed'));
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = maxSize; canvas.height = maxSize;
        const ctx = canvas.getContext('2d');
        const side = Math.min(img.width, img.height);
        const sx = (img.width-side)/2, sy = (img.height-side)/2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  return (data||[]).map(r=>({id:r.id, amount:Number(r.amount), categoryId:r.category_id, memberId:r.member_id, note:r.note, date: r.date, createdAt: Number(r.created_at)}));
}

function loadMyMemberId(){ state.myMemberId = localStorage.getItem('family-cash-member-id'); }
function saveMyMemberId(id){ state.myMemberId = id; localStorage.setItem('family-cash-member-id', id); }

function categoryById(id){ return state.categories.find(c=>c.id===id) || {name:'Другое', color:'var(--cat-7)'}; }
function memberById(id){ return state.members.find(m=>m.id===id); }
function resolveColor(c){
  if(c && typeof c === 'string' && c.startsWith('var(')) return CAT_COLOR_MAP[c] || '#6B7280';
  return c;
}
function pickCategoryColor(){
  const used = new Set(state.categories.map(c=>resolveColor(c.color)));
  for(const c of CAT_COLORS){
    if(!used.has(resolveColor(c))) return c;
  }
  // все базовые цвета заняты — генерируем следующий по кругу оттенков, не повторяя уже использованные
  let hue = (state.categories.length * 47) % 360;
  let hslColor = `hsl(${hue}, 55%, 55%)`;
  let guard = 0;
  while(used.has(hslColor) && guard < 20){
    hue = (hue + 47) % 360;
    hslColor = `hsl(${hue}, 55%, 55%)`;
    guard++;
  }
  return hslColor;
}

function monthRange(year, month){
  return {start: new Date(year, month, 1), end: new Date(year, month+1, 0)};
}
function yearRange(year){
  return {start: new Date(year, 0, 1), end: new Date(year, 11, 31)};
}
function startOfWeekDate(d){
  const day = d.getDay();
  const diff = (day===0 ? -6 : 1-day);
  const r = new Date(d); r.setDate(d.getDate()+diff); r.setHours(0,0,0,0);
  return r;
}
function currentWeekRange(offset){
  offset = offset || 0;
  const base = new Date(); base.setDate(base.getDate() + offset*7);
  const start = startOfWeekDate(base);
  const end = new Date(start); end.setDate(start.getDate()+6);
  return {start, end};
}
function currentMonthRangeReal(offset){
  offset = offset || 0;
  const t = new Date();
  let y = t.getFullYear(), m = t.getMonth()+offset;
  while(m<0){ m+=12; y-=1; } while(m>11){ m-=12; y+=1; }
  return monthRange(y, m);
}
function sumByCategoryMap(expenses){
  const map = {};
  expenses.forEach(e=>{ map[e.categoryId] = (map[e.categoryId]||0) + e.amount; });
  return map;
}
function topCategoryOf(expenses){
  const map = sumByCategoryMap(expenses);
  let best = null;
  Object.entries(map).forEach(([id, amt])=>{ if(!best || amt>best.amt) best = {id, amt}; });
  return best;
}
function periodStats(expenses, dayCount){
  const total = expenses.reduce((s,e)=>s+e.amount,0);
  return { total, avgPerDay: dayCount>0 ? total/dayCount : 0, topCategory: topCategoryOf(expenses) };
}
function changeInfo(current, previous){
  const diff = current - previous;
  let pct = null;
  if(previous !== 0) pct = (diff/previous)*100;
  else if(current !== 0) pct = 100;
  let cls = 'change-flat', sign = '';
  if(diff > 0.5){ cls = 'change-up'; sign = '+'; }
  else if(diff < -0.5){ cls = 'change-down'; sign = '−'; }
  return {diff, pct, cls, sign};
}

function renderDayBarChart(){
  const el = document.getElementById('day-bars');
  const labelsEl = document.getElementById('day-bar-labels');
  const head = document.getElementById('daychart-head');
  if(!el) return;
  const daysInMonth = monthRange(state.selectedYear, state.selectedMonth).end.getDate();
  const byDay = {};
  state.monthExpenses.forEach(e=>{ byDay[e.date] = (byDay[e.date]||0) + e.amount; });
  const max = Math.max(...Object.values(byDay), 1);
  let bars = '', labels = '';
  for(let d=1; d<=daysInMonth; d++){
    const ds = state.selectedYear+'-'+pad(state.selectedMonth+1)+'-'+pad(d);
    const val = byDay[ds] || 0;
    const h = val>0 ? Math.max(Math.round((val/max)*100),3) : 0.5;
    const sel = state.selectedDay===ds ? 'selected' : '';
    bars += `<div class="day-bar-col ${sel}" data-day="${ds}"><div class="day-bar" style="height:${h}%; animation-delay:${(d*0.012).toFixed(3)}s;" title="${d}: ${fmtMoney(val)}"></div></div>`;
    labels += `<span>${d}</span>`;
  }
  el.innerHTML = bars;
  if(labelsEl) labelsEl.innerHTML = labels;
  if(head) head.innerHTML = state.selectedDay ? Math.round(byDay[state.selectedDay]||0).toLocaleString('ru-RU') : '&nbsp;';

  el.querySelectorAll('.day-bar-col').forEach(col=>{

function renderBudget(monthTotal){
  const el = document.getElementById('budget-section');
  if(!el) return;

  if(state.monthlyBudget === null || state.monthlyBudget === undefined || isNaN(state.monthlyBudget)){
    el.innerHTML = `<div class="budget-wrap" id="budget-wrap">
      <div class="budget-empty">Нажмите, чтобы задать бюджет на месяц</div>
    </div>`;
  } else {
    const budget = state.monthlyBudget;
    const pct = budget>0 ? (monthTotal/budget)*100 : 0;
    const cls = pct>100 ? 'over' : (pct>=80 ? 'warn' : 'ok');
    const left = budget - monthTotal;

    // прогноз: актуален только для текущего месяца
    const now = new Date();
    const isCurrentMonth = now.getFullYear()===state.selectedYear && now.getMonth()===state.selectedMonth;
    const daysInMonth = monthRange(state.selectedYear, state.selectedMonth).end.getDate();
    let note;
    if(isCurrentMonth && now.getDate()>1 && monthTotal>0){
      const projected = (monthTotal/now.getDate())*daysInMonth;
      const overProjected = projected > budget;
      note = `<div class="budget-note ${overProjected?'over':''}">При таком темпе за месяц выйдет ≈ ${fmtMoney(projected)}${overProjected?' — выше бюджета':''}</div>`;
    } else if(left < 0){
      note = `<div class="budget-note over">Перерасход на ${fmtMoney(Math.abs(left))}</div>`;
    } else {
      note = `<div class="budget-note">Осталось ${fmtMoney(left)}</div>`;
    }

    el.innerHTML = `<div class="budget-wrap" id="budget-wrap">
      <div class="budget-top">
        <span class="budget-label">Бюджет месяца</span>
        <span class="budget-nums">${fmtMoney(monthTotal)} / ${fmtMoney(budget)} · ${Math.round(pct)}%</span>
      </div>
      <div class="budget-track"><div class="budget-fill ${cls}" id="budget-fill"></div></div>
      ${note}
    </div>`;
    requestAnimationFrame(()=>{
      const fill = document.getElementById('budget-fill');
      if(fill) fill.style.width = Math.min(pct, 100)+'%';
    });
  }

  const wrap = document.getElementById('budget-wrap');
  if(wrap) wrap.addEventListener('click', openBudgetModal);
}

function renderCalendar(){
  const el = document.getElementById('calendar-card');
  if(!el) return;
  const {selectedYear:y, selectedMonth:m} = state;
  const firstDay = new Date(y, m, 1);
  const daysInMonth = new Date(y, m+1, 0).getDate();
  let startOffset = firstDay.getDay() - 1;
  if(startOffset < 0) startOffset = 6;

  const byDay = {};
  state.monthExpenses.forEach(e=>{ byDay[e.date] = (byDay[e.date]||0) + e.amount; });
  const todayStr = toDateStr(new Date());

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = y+'-'+pad(m+1)+'-'+pad(d);
    const total = byDay[ds] || 0;
    const cls = [
      total>0 ? '' : 'no-expense',
      state.selectedDay===ds ? 'selected' : '',
      ds===todayStr ? 'today' : ''
    ].filter(Boolean).join(' ');
    cells += `<div class="cal-day ${cls}" data-day="${ds}" title="${total>0?fmtMoney(total):''}">${d}</div>`;
  }
  el.innerHTML = `
    <div class="cal-weekdays">${WEEKDAYS_SHORT.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-days">${cells}</div>
  `;
  el.querySelectorAll('.cal-day[data-day]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      const day = cell.getAttribute('data-day');
      state.selectedDay = state.selectedDay === day ? null : day;
      haptic(8);
      renderCalendar(); renderDayBarChart(); renderPieAndTape();
    });
  });
}

function currentScopeExpenses(){
  if(state.selectedDay) return state.monthExpenses.filter(e=>e.date===state.selectedDay);
  return state.monthExpenses;
}

function renderPieAndTape(){
  const expenses = currentScopeExpenses();
  renderPie(expenses);
  renderTape(expenses);
}

function rankColor(index, total){
  // самая крупная категория — тёмно-коричневая, самая мелкая — сливочная
  const dark = [0x5C,0x2E,0x06], light = [0xF0,0xE2,0xC4];
  const t = total>1 ? index/(total-1) : 0;
  return '#'+dark.map((d,i)=> Math.round(d + (light[i]-d)*t).toString(16).padStart(2,'0')).join('');
}

function renderPie(expenses){
  const el = document.getElementById('pie-card');
  if(!el) return;
  const total = expenses.reduce((s,e)=>s+e.amount,0);
  const byCat = {};
  expenses.forEach(e=>{ byCat[e.categoryId] = (byCat[e.categoryId]||0) + e.amount; });
  const rows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  if(rows.length===0){
    el.innerHTML = `<div class="pie-empty">Нет данных для диаграммы</div>`;
    return;
  }

  const r = 58, C = 2*Math.PI*r, cx=75, cy=75;
  let offset = 0;
  const circles = rows.map(([catId, amt], idx)=>{
    const color = rankColor(idx, rows.length);
    const dash = (amt/total)*C;
    const circle = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="26" stroke-linecap="butt" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-offset}" />`;
    offset += dash;
    return circle;
  }).join('');

  el.innerHTML = `
    <div class="donut-col">
      <div class="donut-row">
        <div class="donut-svg-wrap">
          <svg width="150" height="150" viewBox="0 0 150 150" style="transform:rotate(-90deg);">${circles}</svg>
        </div>
        <div class="pie-legend">
          ${rows.map(([catId, amt], idx)=>{
            const cat = categoryById(catId);
            return `<div class="pie-legend-row">
              <span class="pie-legend-name"><span class="pie-legend-dot" style="background:${rankColor(idx, rows.length)};"></span>${escapeHtml(cat.name)}</span>
              <span class="pie-legend-amt">${Math.round(amt).toLocaleString('ru-RU')}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="donut-total">${Math.round(total).toLocaleString('ru-RU')}</div>
    </div>
  `;
}

function applySearch(expenses){
  const q = (state.searchQuery||'').trim().toLowerCase();
  if(!q) return expenses;
  return expenses.filter(e=>{
    const cat = categoryById(e.categoryId);
    const m = memberById(e.memberId);
    return (cat.name||'').toLowerCase().includes(q)
      || (e.note||'').toLowerCase().includes(q)
      || (m && (m.name||'').toLowerCase().includes(q))
      || String(Math.round(e.amount)).includes(q);
  });
}

function renderTape(allExpenses){
  const el = document.getElementById('tape');
  if(!el) return;

  const expenses = applySearch(allExpenses);
  const searchInfo = (state.searchQuery||'').trim()
    ? `<div class="search-count">Найдено: ${expenses.length} · на сумму ${fmtMoney(expenses.reduce((s,e)=>s+e.amount,0))}</div>`
    : '';

  const dayTotal = state.selectedDay ? expenses.reduce((s,e)=>s+e.amount,0) : 0;
  const header = state.selectedDay ? `
    <div class="day-detail-header">
      <div style="display:flex;align-items:baseline;gap:10px;">
        <div class="day-label" style="margin:0;">${formatDateLong(state.selectedDay)}</div>
        <span class="day-total-amt">${fmtMoney(dayTotal)}</span>
      </div>
      <button class="back-to-month" id="back-to-month">← Показать весь месяц</button>
    </div>` : '';

  if(expenses.length===0){
    const emptyMsg = (state.searchQuery||'').trim()
      ? 'Ничего не найдено по этому запросу.'
      : 'Трат здесь ещё нет.<br>Нажмите «+», чтобы записать первую.';
    el.innerHTML = header + searchInfo + `<div class="empty-tape">${emptyMsg}</div>`;
    attachBackButton();
    return;
  }

  if(state.selectedDay){
    const items = expenses.slice().sort((a,b)=>b.createdAt-a.createdAt);
    el.innerHTML = header + searchInfo + renderReceiptList(items);
  } else {
    const byDay = {};
    expenses.forEach(e=>{ (byDay[e.date] = byDay[e.date]||[]).push(e); });
    const days = Object.keys(byDay).sort().reverse();
    el.innerHTML = header + searchInfo + days.map(date=>{
      const items = byDay[date].sort((a,b)=>b.createdAt-a.createdAt);
      const groupTotal = items.reduce((s,e)=>s+e.amount,0);
      return `<div class="day-group"><div class="day-label"><span>${formatDateLong(date)}</span><span class="day-total-amt">${fmtMoney(groupTotal)}</span></div>${renderReceiptList(items)}</div>`;
    }).join('');
  }

  el.querySelectorAll('.receipt').forEach(r=>{
    r.addEventListener('click', ()=>{
      const id = r.getAttribute('data-expense-id');
      const exp = state.monthExpenses.find(e=>e.id===id);
      if(exp) openEditExpense(exp);
    });
  });
  attachBackButton();
}

function attachBackButton(){
  const btn = document.getElementById('back-to-month');
  if(btn) btn.addEventListener('click', ()=>{ state.selectedDay = null; renderCalendar(); renderDayBarChart(); renderPieAndTape(); });
}

function renderReceiptList(items){
  return items.map(e=>{
    const cat = categoryById(e.categoryId);
    const m = memberById(e.memberId);
    return `<div class="receipt" data-expense-id="${e.id}">
      <div class="receipt-main">
        <div class="receipt-cat">${escapeHtml(cat.name)}</div>
        ${e.note ? `<div class="receipt-note">${escapeHtml(e.note)}</div>` : ''}
      </div>
      <div class="receipt-tail">
        <span class="receipt-member">${m ? memberNameHtml(m) : '—'}</span>
        <span class="receipt-amount">${Math.round(e.amount).toLocaleString('ru-RU')}</span>
      </div>
    </div>`;
  }).join('');
}

function formatDateLong(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.getDate()+' '+MONTHS_GENITIVE[d.getMonth()]+', '+WEEKDAYS[d.getDay()];
}

function shiftMonth(delta){
  state.selectedMonth += delta;
  while(state.selectedMonth < 0){ state.selectedMonth += 12; state.selectedYear -= 1; }
  while(state.selectedMonth > 11){ state.selectedMonth -= 12; state.selectedYear += 1; }
  state.selectedDay = null;
  haptic();
  renderApp();
}

function attachMainEvents(){
  attachTopbarEvents();
  document.getElementById('prev-year').addEventListener('click', ()=>{ state.selectedYear -= 1; state.selectedDay = null; haptic(); renderApp(); });
  document.getElementById('next-year').addEventListener('click', ()=>{ state.selectedYear += 1; state.selectedDay = null; haptic(); renderApp(); });
  document.getElementById('prev-month').addEventListener('click', ()=> shiftMonth(-1));
  document.getElementById('next-month').addEventListener('click', ()=> shiftMonth(1));
  document.getElementById('fab-add').addEventListener('click', ()=>{ haptic(); openAddExpense(); });
  // Поиск по тратам
  const search = document.getElementById('search-input');
  if(search){
    let searchTimer = null;
    search.addEventListener('input', (e)=>{
      state.searchQuery = e.target.value;
      if(searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(()=>{
        renderPieAndTape();
        const clear = document.getElementById('search-clear');
        const toolbar = document.querySelector('.tape-toolbar');
        if(state.searchQuery && !clear && toolbar){
          const btn = document.createElement('button');
          btn.className = 'search-clear'; btn.id = 'search-clear'; btn.textContent = '✕';
          btn.addEventListener('click', clearSearch);
          toolbar.appendChild(btn);
        } else if(!state.searchQuery && clear){
          clear.remove();
        }
      }, 180);
    });
  }
  const clearBtn = document.getElementById('search-clear');
  if(clearBtn) clearBtn.addEventListener('click', clearSearch);

  attachSwipeNavigation();
}

function clearSearch(){
  state.searchQuery = '';
  const input = document.getElementById('search-input');
  if(input) input.value = '';
  const clear = document.getElementById('search-clear');
  if(clear) clear.remove();
  renderPieAndTape();
}

let swipeAttached = false;
function attachSwipeNavigation(){
  const app = document.getElementById('app');
  if(!app || swipeAttached) return;
  swipeAttached = true;
  let startX = 0, startY = 0, tracking = false;
  app.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) { tracking = false; return; }
    const t = e.touches[0];
    // не перехватываем свайпы внутри полей ввода и горизонтально прокручиваемых блоков
    if(e.target.closest('input, textarea, .overlay, .chip-grid')) { tracking = false; return; }
    startX = t.clientX; startY = t.clientY; tracking = true;
  }, {passive:true});
  app.addEventListener('touchend', (e)=>{
    if(!tracking) return;
    tracking = false;
    if(state.currentPage !== 'home') return;      // свайп работает только в «Кассе»
    if(document.querySelector('.overlay')) return; // не мешаем открытым окнам
    const t = e.changedTouches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.8){
      shiftMonth(dx < 0 ? 1 : -1);
    }
  }, {passive:true});
}

      </div>
    </div>`;
  document.body.appendChild(overlay);
  let selectedMember = state.myMemberId;
  let saving = false;

  function renderCatChips(){
    const box = overlay.querySelector('#cat-chips');
    if(state.categories.length && !state.categories.some(c=>c.id===selectedCategory)){
      selectedCategory = state.categories[0].id;
    }
    box.innerHTML = state.categories.map(c=>
      `<div class="chip ${c.id===selectedCategory?'selected':''}" data-cat="${c.id}"><span class="chip-dot" style="background:${resolveColor(c.color)};"></span>${escapeHtml(c.name)}</div>`
    ).join('');
    box.querySelectorAll('.chip[data-cat]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        box.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected'); selectedCategory = chip.getAttribute('data-cat');
        haptic(8);
      });
    });
  }
  renderCatChips();

  const amountInput = overlay.querySelector('#exp-amount');
  overlay.querySelectorAll('.quick-amt').forEach(b=>{
    b.addEventListener('click', ()=>{
      const add = parseFloat(b.getAttribute('data-amt'));
      const cur = parseFloat(amountInput.value) || 0;
      amountInput.value = cur + add;
      haptic(8);
    });
  });

  overlay.querySelector('#manage-cats-link').addEventListener('click', ()=>{
    openCategoryManager(()=> renderCatChips());
  });

  overlay.querySelectorAll('#member-chips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      overlay.querySelectorAll('#member-chips .chip').forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected'); selectedMember = chip.getAttribute('data-mem');
      haptic(8);
    });
  });

  overlay.querySelector('#exp-cancel').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay && !saving) overlay.remove(); });

  overlay.querySelector('#exp-save').addEventListener('click', async ()=>{
    if(saving) return;
    const btn = overlay.querySelector('#exp-save');
    const amountVal = parseFloat(amountInput.value);
    const dateVal = overlay.querySelector('#exp-date').value;
    const noteVal = overlay.querySelector('#exp-note').value.trim();
    const errEl = overlay.querySelector('#exp-error');
    if(!amountVal || amountVal<=0){ errEl.textContent = 'Укажите сумму больше нуля.'; return; }
    if(!selectedCategory){ errEl.textContent = 'Выберите категорию.'; return; }

      state.selectedMonth = expDate.getMonth();
      state.selectedDay = dateVal;
      renderApp();
    } else {
      refreshData();
    }
  });
  setTimeout(()=> amountInput.focus(), 50);
}

  });

  overlay.querySelector('#exp-cancel').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

  overlay.querySelector('#exp-delete').addEventListener('click', ()=>{
    overlay.remove();
    openDeleteConfirm(exp);
  });

  let savingEdit = false;
  overlay.querySelector('#exp-save').addEventListener('click', async ()=>{
    if(savingEdit) return;
    const btn = overlay.querySelector('#exp-save');
    const amountVal = parseFloat(overlay.querySelector('#exp-amount').value);
    const dateVal = overlay.querySelector('#exp-date').value;
    const noteVal = overlay.querySelector('#exp-note').value.trim();
    const errEl = overlay.querySelector('#exp-error');
    if(!amountVal || amountVal<=0){ errEl.textContent = 'Укажите сумму больше нуля.'; return; }
    if(!selectedMember){ errEl.textContent = 'Выберите, кто платил.'; return; }
    if(!dateVal){ errEl.textContent = 'Укажите дату.'; return; }
    if(!navigator.onLine){ errEl.textContent = 'Нет соединения — изменения не сохранятся.'; return; }
    savingEdit = true; setBtnLoading(btn, true); errEl.textContent = '';
    const patch = {amount: amountVal, categoryId: selectedCategory, memberId: selectedMember, note: noteVal, date: dateVal};
    const ok = await updateExpenseRow(exp.id, patch);
    savingEdit = false; setBtnLoading(btn, false);
    if(!ok) return;
    haptic();
    overlay.remove(); toast('Трата обновлена');
    const expDate = new Date(dateVal+'T00:00:00');
    if(expDate.getFullYear() !== state.selectedYear || expDate.getMonth() !== state.selectedMonth){
      state.selectedYear = expDate.getFullYear();
      state.selectedMonth = expDate.getMonth();
      state.selectedDay = dateVal;
      renderApp();
    } else {
      refreshData();
    }
  });
  setTimeout(()=> overlay.querySelector('#exp-amount').focus(), 50);
}

// ---------- АНАЛИТИКА ----------

function renderAnalyticsShell(){
  return `
    ${renderTopbar()}
    <div class="period-toggle" id="period-toggle">
      <button data-period="week" class="${state.comparePeriod==='week'?'active':''}">Неделя</button>
      <button data-period="month" class="${state.comparePeriod==='month'?'active':''}">Месяц</button>
    </div>

    <div class="analytics-wrap">
    <div class="analytics-section">
      <h3>Сравнение периодов</h3>
      <div id="compare-content"><div class="loading-note">Считаем…</div></div>
    </div>

    <div class="analytics-section">
      <h3>Динамика трат</h3>
      <div class="trend-chart" id="trend-chart"><div class="loading-note">Считаем…</div></div>
      <div id="trend-breakdown-container"></div>
    </div>

    <div class="analytics-section">
      <h3>Изменения по категориям</h3>
      <div id="category-changes"><div class="loading-note">Считаем…</div></div>
    </div>

    <div class="analytics-section">
      <h3>Траты по дням недели</h3>
      <div class="weekday-chart" id="weekday-chart"><div class="loading-note">Считаем…</div></div>
    </div>
    </div>

    <button class="profile-fab" id="profile-fab" title="Профиль">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="#F2EBDB"/><path d="M4 20.5c0-4.3 3.6-7.5 8-7.5s8 3.2 8 7.5" stroke="#F2EBDB" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
    </button>
  `;
}

function attachAnalyticsEvents(){
  document.querySelectorAll('#period-toggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.comparePeriod = btn.getAttribute('data-period');
      state.selectedTrendIndex = null;
      document.querySelectorAll('#period-toggle button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      loadAnalyticsData();
    });
  });
}

async function loadAnalyticsData(){
  const memberId = state.filterMemberId;
  const period = state.comparePeriod;

  let curRange, prevRange, dayCountCur, dayCountPrev, curLabel, prevLabel;
  if(period === 'week'){
    curRange = currentWeekRange(0);
    prevRange = currentWeekRange(-1);
    dayCountCur = 7; dayCountPrev = 7;
    curLabel = 'Эта неделя'; prevLabel = 'прошлой неделей';
  } else {
    curRange = currentMonthRangeReal(0);
    prevRange = currentMonthRangeReal(-1);
    dayCountCur = curRange.end.getDate(); dayCountPrev = prevRange.end.getDate();
    curLabel = 'Этот месяц'; prevLabel = 'прошлым месяцем';
  }

  const trendCount = 8;
  const trendStart = period==='week' ? currentWeekRange(-(trendCount-1)).start : currentMonthRangeReal(-(trendCount-1)).start;
  const trendEnd = curRange.end;

  const wdEnd = new Date();
  const wdStart = new Date(); wdStart.setDate(wdEnd.getDate()-83);

  const [curExp, prevExp, trendExp, wdExp] = await Promise.all([
    fetchExpensesRange(toDateStr(curRange.start), toDateStr(curRange.end), memberId),
    fetchExpensesRange(toDateStr(prevRange.start), toDateStr(prevRange.end), memberId),
    fetchExpensesRange(toDateStr(trendStart), toDateStr(trendEnd), memberId),
    fetchExpensesRange(toDateStr(wdStart), toDateStr(wdEnd), memberId),
  ]);

  state.analytics = { curExp, prevExp, curRange, prevRange, dayCountCur, dayCountPrev, curLabel, prevLabel, trendExp, wdExp };

  renderComparison();
  renderTrend();
  renderCategoryChanges();
  renderWeekdayPattern();
}

function renderComparison(){
  const el = document.getElementById('compare-content');
  if(!el) return;
  const a = state.analytics;
  const curStats = periodStats(a.curExp, a.dayCountCur);
  const prevStats = periodStats(a.prevExp, a.dayCountPrev);
  const totalChange = changeInfo(curStats.total, prevStats.total);
  const avgChange = changeInfo(curStats.avgPerDay, prevStats.avgPerDay);

  function row(label, curVal, prevVal, change){
    const badgeText = change.pct===null ? '' : `${change.sign}${Math.abs(change.pct).toFixed(0)}%`;
    const diffText = `${change.diff>=0?'+':'−'}${fmtMoney(Math.abs(change.diff))}`;
    return `<div class="compare-metric">
      <div class="compare-metric-label">${label}</div>
      <div class="compare-metric-value"><span class="count-value" data-value="${curVal}">${fmtMoney(0)}</span>${badgeText?`<span class="change-badge ${change.cls}">${badgeText}</span>`:''}</div>
      <div class="compare-metric-sub">было ${fmtMoney(prevVal)} · разница ${diffText}</div>
    </div>`;
  }

  el.innerHTML = `
    <div class="compare-card">
      ${row('Общая сумма расходов', curStats.total, prevStats.total, totalChange)}
      ${row('Средний расход в день', curStats.avgPerDay, prevStats.avgPerDay, avgChange)}
    </div>
  `;
  el.querySelectorAll('.count-value').forEach((span, idx)=>{
    const target = parseFloat(span.getAttribute('data-value'));
    setTimeout(()=> animateCountUp(span, target, fmtMoney, 700), idx*100);
  });
}

function renderTrend(){
  const el = document.getElementById('trend-chart');
  if(!el) return;
  const a = state.analytics;
  const period = state.comparePeriod;
  const count = 8;
  const points = [];
  for(let i=count-1; i>=0; i--){
    let range, label;
    if(period === 'week'){
      range = currentWeekRange(-i);
      label = pad(range.start.getDate())+'.'+pad(range.start.getMonth()+1);
    } else {
      range = currentMonthRangeReal(-i);
      label = MONTHS_SHORT[range.start.getMonth()];
    }
    const startStr = toDateStr(range.start), endStr = toDateStr(range.end);
    const periodExpenses = a.trendExp.filter(e => e.date >= startStr && e.date <= endStr);
    const total = periodExpenses.reduce((s,e)=>s+e.amount,0);
    points.push({label, total, isCurrent: i===0, periodExpenses});
  }
  state.trendPoints = points;
  const max = Math.max(...points.map(p=>p.total), 1);
  el.innerHTML = points.map((p, idx)=>{
    const h = p.total>0 ? Math.max(Math.round((p.total/max)*100),4) : 2;
    const sel = state.selectedTrendIndex===idx ? 'trend-selected' : '';
    return `<div class="trend-bar-col ${p.isCurrent?'current':''} ${sel}" data-idx="${idx}">
      <div class="trend-bar" style="height:${h}%; animation-delay:${(idx*0.03).toFixed(2)}s;" title="${fmtMoney(p.total)}"></div>
      <div class="trend-bar-label">${p.label}</div>
    </div>`;
  }).join('');

  el.querySelectorAll('.trend-bar-col').forEach(col=>{
    col.addEventListener('click', ()=>{
      const idx = parseInt(col.getAttribute('data-idx'));
      state.selectedTrendIndex = state.selectedTrendIndex === idx ? null : idx;
      renderTrend();
    });
  });

  renderTrendBreakdown();
}

function renderTrendBreakdown(){
  const container = document.getElementById('trend-breakdown-container');
  if(!container) return;
  if(state.selectedTrendIndex===null || !state.trendPoints || !state.trendPoints[state.selectedTrendIndex]){
    container.innerHTML = '';
    return;
  }
  const point = state.trendPoints[state.selectedTrendIndex];
  const map = sumByCategoryMap(point.periodExpenses);
  const rows = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const periodLabel = point.isCurrent ? 'текущий период' : point.label;

  if(rows.length===0){
    container.innerHTML = `<div class="trend-breakdown">
      <div class="trend-breakdown-title"><span>Разбивка за ${periodLabel}</span><span class="trend-breakdown-close" id="trend-breakdown-close">закрыть</span></div>
      <div class="pie-empty">Трат не было.</div>
    </div>`;
  } else {
    container.innerHTML = `<div class="trend-breakdown">
      <div class="trend-breakdown-title"><span>Разбивка за ${periodLabel}</span><span class="trend-breakdown-close" id="trend-breakdown-close">закрыть</span></div>
      ${rows.map(([id,amt], i)=>{
        const cat = categoryById(id);
        return `<div class="trend-breakdown-row" style="animation-delay:${(i*0.04).toFixed(2)}s;"><span class="trend-breakdown-name">${cat.name}</span><span class="trend-breakdown-amt">${fmtMoney(amt)}</span></div>`;
      }).join('')}
    </div>`;
  }
  const closeBtn = document.getElementById('trend-breakdown-close');
  if(closeBtn) closeBtn.addEventListener('click', ()=>{
    state.selectedTrendIndex = null;
    renderTrend();
  });
}

function renderCategoryChanges(){
  const el = document.getElementById('category-changes');
  if(!el) return;
  const a = state.analytics;
  const curMap = sumByCategoryMap(a.curExp);
  const prevMap = sumByCategoryMap(a.prevExp);
  const ids = new Set([...Object.keys(curMap), ...Object.keys(prevMap)]);
  const rows = Array.from(ids).map(id=>{
    const cur = curMap[id]||0, prev = prevMap[id]||0;
    return {id, cur, prev, change: changeInfo(cur, prev)};
  }).sort((x,y)=> Math.abs(y.change.diff) - Math.abs(x.change.diff));

  if(rows.length===0){ el.innerHTML = '<div class="pie-empty">Нет данных для сравнения.</div>'; return; }

  el.innerHTML = rows.map((r, idx)=>{
    const cat = categoryById(r.id);
    const badgeText = r.change.pct===null ? '—' : `${r.change.sign}${Math.abs(r.change.pct).toFixed(0)}%`;
    const diffText = `${r.change.diff>=0?'+':'−'}${fmtMoney(Math.abs(r.change.diff))}`;
    return `<div class="cat-change-row" style="animation-delay:${(idx*0.04).toFixed(2)}s;">
      <span class="cat-change-name">${cat.name}</span>
      <span class="cat-change-nums">
        <span>${fmtMoney(r.cur)}</span>
        <span style="opacity:.5;">${diffText}</span>
        <span class="change-badge ${r.change.cls}">${badgeText}</span>
      </span>
    </div>`;
  }).join('');
}

function renderWeekdayPattern(){
  const el = document.getElementById('weekday-chart');
  if(!el) return;
  const a = state.analytics;
  const sums = [0,0,0,0,0,0,0];
  a.wdExp.forEach(e=>{
    const d = new Date(e.date+'T00:00:00');
    let idx = d.getDay()-1; if(idx<0) idx = 6;
    sums[idx] += e.amount;
  });
  const max = Math.max(...sums, 1);
  const peakVal = Math.max(...sums);
  el.innerHTML = sums.map((v,i)=>{
    const h = v>0 ? Math.max(Math.round((v/max)*100),4) : 2;
    return `<div class="weekday-bar-col ${v===peakVal && v>0 ? 'peak' : ''}">
      <div class="weekday-bar" style="height:${h}%; animation-delay:${(i*0.04).toFixed(2)}s;" title="${fmtMoney(v)}"></div>
      <div class="weekday-bar-label">${WEEKDAYS_SHORT[i]}</div>
      <div class="weekday-bar-amt">${v>0 ? Math.round(v).toLocaleString('ru-RU') : ''}</div>
    </div>`;
  }).join('');
}

function openDeleteConfirm(exp){
  const cat = categoryById(exp.categoryId); const m = memberById(exp.memberId);
  const overlay = document.createElement('div'); overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:340px;">
      <h2>Удалить трату?</h2>
      <p style="font-size:14px;color:var(--ink-soft);">${cat.name} · ${fmtMoney(exp.amount)} · ${m?m.name:'—'}${exp.note? ' · '+escapeHtml(exp.note):''}</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="del-cancel">Отмена</button>
        <button class="btn btn-danger" id="del-confirm">Удалить</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#del-cancel').addEventListener('click', ()=> overlay.remove());
  overlay.querySelector('#del-confirm').addEventListener('click', async ()=>{
    const btn = overlay.querySelector('#del-confirm');
    setBtnLoading(btn, true);
    const snapshot = Object.assign({}, exp); // копия для возможной отмены
    await deleteExpenseRow(exp.id);
    setBtnLoading(btn, false);
    overlay.remove();
    haptic();
    refreshData();
    toast('Трата удалена', {
      label: 'Вернуть',
      onClick: async ()=>{
        const ok = await insertExpense(snapshot);
        if(ok){ toast('Трата восстановлена'); refreshData(); }
      }
    });
  });
}

async function init(){
  if(!sb){ renderApp(); return; }
  await Promise.all([loadMembers(), loadCategories(), loadSettings()]);
  loadMyMemberId();
  updateOnlineStatus();
  renderApp();
  sb.channel('expenses-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'expenses'}, ()=>{ if(state.myMemberId) refreshData(); })
    .subscribe();
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
