<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Семейная касса</title>
<link rel="stylesheet" href="vendor/fonts.css">
<script defer src="vendor/supabase-2.117.3.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9CB5AD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Касса">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
  :root{
    --teal:#96B8B8;
    --teal-dark:#82A8A8;
    --cream:#EEE8D8;
    --cream-soft:#F6F1E5;
    --cream-row:#E8E1D0;
    --brown:#7A3D0A;
    --brown-deep:#572A07;
    --brown-mid:#955318;
    --ink:#4A2A0C;
    --ink-soft:#8B7054;
    --cream-text:#FFF9EC;
    --tan:#C59B69;
    --rust:#A8442C;
    --paper:#F6F1E5;
    --bg-deep:var(--teal);
    --bg-panel:var(--cream);
    --bg-panel-2:var(--cream-soft);
    --gold:var(--brown);
    --gold-soft:var(--brown);
    --cat-1:#7C9473; --cat-2:#5B7FA6; --cat-3:#A8442C; --cat-4:#C9A876;
    --cat-5:#8C5B7A; --cat-6:#6B7280; --cat-7:#4E8C82; --cat-8:#A65D8E;
    --line:rgba(87,42,7,.16);
    --line-strong:rgba(87,42,7,.26);
    --shadow-sm:0 6px 18px rgba(65,43,24,.10);
    --shadow-md:0 14px 36px rgba(65,43,24,.16);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --ease:cubic-bezier(.4,0,.2,1);
    --font-display:'Playfair Display', serif;
    --font-head:'Inter', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'Inter', sans-serif;
  }

  *{box-sizing:border-box;}
  html{background:var(--teal);}
  body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 12% -10%, rgba(255,255,255,.12), transparent 35%),
      var(--teal);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button,input{font:inherit;}
  button{-webkit-tap-highlight-color:transparent;}
  .app{width:min(1180px,100%);margin:0 auto;padding:0 0 112px;}

  /* ================= ШАПКА ================= */
  .topbar{
    display:grid;
    grid-template-columns:auto auto minmax(0,1fr);
    align-items:center;
    gap:20px;
    min-height:96px;
    padding:16px 24px;
  }
  .brand{position:relative;line-height:1;flex-shrink:0;min-width:188px;}
  .brand .b-top{
    display:block;
    font-family:var(--font-head);
    font-weight:900;
    font-size:clamp(24px,2.65vw,32px);
    line-height:1;
    letter-spacing:.075em;
    color:var(--cream-text);
    text-transform:uppercase;
    -webkit-text-stroke:0 transparent;
    text-shadow:none;
  }
  .brand .b-bot{
    display:block;
    margin:-5px 0 0 30px;
    font-family:var(--font-display);
    font-style:italic;
    font-weight:800;
    font-size:clamp(25px,2.8vw,34px);
    line-height:1;
    letter-spacing:.01em;
    color:var(--brown);
    text-transform:uppercase;
  }

  .page-tabs{
    display:flex;
    align-items:center;
    padding:4px;
    gap:2px;
    border:1px solid rgba(255,255,255,.32);
    border-radius:16px;
    background:rgba(246,241,229,.78);
    box-shadow:0 3px 10px rgba(60,35,10,.08);
    backdrop-filter:blur(8px);
  }
  .page-tabs button{
    min-height:36px;
    padding:8px 16px;
    border:0;
    border-radius:12px;
    background:transparent;
    color:var(--brown);
    cursor:pointer;
    font-size:11px;
    font-weight:800;
    letter-spacing:.055em;
    text-transform:uppercase;
    white-space:nowrap;
    transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease);
  }
  .page-tabs button:hover{transform:translateY(-1px);}
  .page-tabs button.active{background:var(--brown);color:var(--cream-text);box-shadow:0 3px 9px rgba(87,42,7,.18);}

  .topbar-actions{min-width:0;display:flex;justify-content:flex-end;}
  .member-pill-group{
    max-width:100%;
    display:flex;
    align-items:center;
    gap:4px;
    padding:4px;
    overflow-x:auto;
    overscroll-behavior-inline:contain;
    scrollbar-width:none;
    border:1px solid rgba(255,255,255,.32);
    border-radius:16px;
    background:rgba(246,241,229,.78);
    box-shadow:0 3px 10px rgba(60,35,10,.08);
    backdrop-filter:blur(8px);
  }
  .member-pill-group::-webkit-scrollbar{display:none;}
  .member-chip{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-height:36px;
    max-width:220px;
    padding:8px 12px;
    border-radius:12px;
    background:transparent;
    color:var(--brown);
    cursor:pointer;
    font-size:11px;
    font-weight:750;
    letter-spacing:.035em;
    line-height:1.1;
    text-transform:uppercase;
    white-space:nowrap;
    transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease);
  }
  .member-chip:hover{background:rgba(122,61,10,.07);}
  .member-chip.active{background:var(--brown);color:var(--cream-text);box-shadow:0 3px 9px rgba(87,42,7,.16);}
  .avatar{
    width:18px;height:18px;flex:0 0 18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:8px;font-weight:800;color:var(--cream-text);background:var(--brown-deep);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
  }
  .avatar-photo{background-size:cover;background-position:center;}
  .edit-profile-btn,.member-switch-btn{display:none;}

  /* ================= ПЕРИОД + МАСЛО ================= */
  .period-band{
    position:relative;
    isolation:isolate;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(230px,300px) minmax(0,1fr);
    grid-template-areas:"year oil month";
    align-items:center;
    gap:24px;
    min-height:126px;
    padding:18px 28px;
    background:var(--cream);
    border-top:1px solid rgba(255,255,255,.42);
    border-bottom:1px solid var(--line);
  }
  .period-band > .wheel:first-child{grid-area:year;justify-self:start;}
  .period-band > .wheel:last-child{grid-area:month;justify-self:end;}
  .wheel{
    min-width:0;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .wheel-arrow{
    width:34px;height:34px;flex:0 0 34px;
    display:grid;place-items:center;
    padding:0;border:0;border-radius:10px;
    background:transparent;color:var(--ink-soft);
    cursor:pointer;font-size:24px;line-height:1;
    transition:background .16s ease,color .16s ease,transform .16s var(--spring);
  }
  .wheel-arrow:hover{background:rgba(122,61,10,.08);color:var(--brown);transform:translateY(-1px);}
  .wheel-peek{
    max-width:82px;
    overflow:hidden;text-overflow:ellipsis;
    font-family:var(--font-head);font-weight:650;font-size:11px;
    color:rgba(122,61,10,.38);text-transform:uppercase;white-space:nowrap;
  }
  .wheel-main{
    display:inline-block;
    font-family:var(--font-head);font-weight:850;font-size:clamp(22px,2.8vw,30px);
    color:var(--brown-deep);letter-spacing:-.025em;text-transform:uppercase;white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  @keyframes wheelRoll{0%{opacity:0;transform:translateY(28%);}100%{opacity:1;transform:translateY(0);}}
  .wheel-main.rolling{animation:wheelRoll .28s var(--ease) both;}

  .puddle-slot{grid-area:oil;position:relative;z-index:1;width:100%;transform:none;}
  .oil-puddle{
    position:relative;
    width:100%;
    height:88px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    border:1px solid rgba(87,42,7,.22);
    border-radius:24px;
    cursor:default;
    background:
      radial-gradient(ellipse at 16% 22%,rgba(255,255,255,.46) 0 7%,rgba(255,255,255,.05) 31%,transparent 48%),
      radial-gradient(ellipse at 82% 72%,rgba(71,136,132,.24) 0 8%,rgba(184,135,74,.12) 35%,transparent 58%),
      linear-gradient(112deg,rgba(238,211,157,.42) 0%,rgba(128,84,39,.16) 22%,rgba(91,143,137,.20) 43%,rgba(235,221,185,.40) 61%,rgba(142,93,43,.18) 78%,rgba(82,134,132,.18) 100%),
      rgba(185,156,112,.16);
    background-size:155% 155%,170% 170%,230% 230%,100% 100%;
    background-position:0% 20%,100% 70%,0% 50%,0 0;
    box-shadow:
      0 10px 24px rgba(76,51,25,.14),
      inset 0 1px 0 rgba(255,255,255,.72),
      inset 0 -12px 28px rgba(94,61,26,.08);
    backdrop-filter:blur(2px) saturate(1.08);
    animation:oilSurface 9s ease-in-out infinite alternate,oilPulse 5.5s ease-in-out infinite;
    will-change:background-position,box-shadow;
  }
  .oil-puddle::before{
    content:"";
    position:absolute;
    inset:-46% -28%;
    border-radius:42%;
    background:
      radial-gradient(ellipse at 34% 42%,rgba(255,244,203,.50) 0 6%,transparent 29%),
      radial-gradient(ellipse at 70% 58%,rgba(70,134,132,.34) 0 7%,transparent 32%),
      conic-gradient(from 25deg at 50% 50%,
        rgba(255,246,218,.02) 0deg,
        rgba(112,72,30,.30) 48deg,
        rgba(226,190,112,.36) 92deg,
        rgba(72,143,136,.32) 145deg,
        rgba(255,246,218,.38) 204deg,
        rgba(151,91,38,.26) 256deg,
        rgba(68,126,126,.28) 316deg,
        rgba(255,246,218,.02) 360deg);
    filter:blur(11px) saturate(1.03);
    mix-blend-mode:multiply;
    opacity:.88;
    transform-origin:50% 50%;
    animation:oilDrift 7.5s ease-in-out infinite alternate,oilTurn 24s linear infinite;
    will-change:transform;
    pointer-events:none;
  }
  .oil-puddle::after{
    content:"";
    position:absolute;
    top:7px;bottom:7px;left:-38%;
    width:58%;
    border-radius:50%;
    background:linear-gradient(100deg,transparent 3%,rgba(255,255,255,.05) 18%,rgba(255,255,255,.58) 48%,rgba(255,244,210,.18) 67%,transparent 94%);
    filter:blur(5px);
    opacity:.68;
    transform:skewX(-16deg);
    animation:oilHighlight 6.8s ease-in-out infinite;
    will-change:transform,opacity;
    pointer-events:none;
  }
  @keyframes oilSurface{
    0%{background-position:0% 18%,100% 74%,0% 48%,0 0;}
    50%{background-position:32% 36%,70% 44%,54% 52%,0 0;}
    100%{background-position:62% 12%,38% 78%,100% 47%,0 0;}
  }
  @keyframes oilPulse{
    0%,100%{box-shadow:0 10px 24px rgba(76,51,25,.14),inset 0 1px 0 rgba(255,255,255,.72),inset 0 -12px 28px rgba(94,61,26,.08);}
    50%{box-shadow:0 12px 27px rgba(76,51,25,.17),inset 0 1px 0 rgba(255,255,255,.82),inset 0 -10px 30px rgba(73,122,119,.11);}
  }
  @keyframes oilDrift{
    0%{transform:translate3d(-7%,-3%,0) rotate(-4deg) scale(1.02);}
    50%{transform:translate3d(3%,3%,0) rotate(2deg) scale(1.08);}
    100%{transform:translate3d(8%,-1%,0) rotate(5deg) scale(1.04);}
  }
  @keyframes oilTurn{to{rotate:360deg;}}
  @keyframes oilHighlight{
    0%,12%{transform:translateX(0) skewX(-16deg);opacity:.18;}
    48%{opacity:.72;}
    78%,100%{transform:translateX(240%) skewX(-16deg);opacity:.12;}
  }
  .oil-number{
    position:relative;z-index:2;
    font-family:var(--font-head);font-weight:850;font-size:clamp(29px,3.7vw,42px);
    line-height:.98;letter-spacing:-.035em;color:#fffaf0;
    font-variant-numeric:tabular-nums;
    text-shadow:0 2px 9px rgba(55,31,9,.65),0 0 18px rgba(55,31,9,.26);
    transition:opacity .3s var(--ease),filter .3s var(--ease),transform .3s var(--ease);
  }
  .oil-number.dissolving{opacity:0;filter:blur(7px);transform:scale(.94);}
  .oil-caption{
    position:relative;z-index:2;
    font-size:9px;font-weight:800;line-height:1;
    color:rgba(255,250,240,.9);letter-spacing:.14em;text-transform:uppercase;
    text-shadow:0 1px 4px rgba(55,31,9,.65);
  }

  /* ================= ГРАФИК + ТОП 5 ================= */
  .cream-panel{
    display:grid;
    grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr);
    gap:28px;
    align-items:stretch;
    padding:26px 28px 24px;
    background:var(--cream-soft);
    border-bottom:1px solid var(--line);
  }
  .cream-panel>div{min-width:0;}
  .cream-panel>div:last-child{padding-left:28px;border-left:1px solid var(--line);}
  .daychart-head{
    min-height:28px;margin:0 0 10px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-head);font-weight:800;font-size:17px;color:var(--brown-deep);
    font-variant-numeric:tabular-nums;
  }
  .day-bars{
    height:132px;
    display:flex;align-items:flex-end;gap:3px;
    padding:0 3px 0 5px;
    border-left:1px solid rgba(87,42,7,.28);
    border-bottom:1px solid rgba(87,42,7,.28);
  }
  .day-bar-col{flex:1;height:100%;min-width:2px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;}
  .day-bar{
    width:58%;min-width:3px;min-height:2px;
    border-radius:3px 3px 0 0;
    background:rgba(122,61,10,.68);
    transform-origin:bottom;
    animation:barGrow .45s var(--spring) both;
    transition:width .16s var(--spring),background .16s ease,filter .16s ease;
  }
  .day-bar-col:hover .day-bar{background:var(--brown-mid);filter:brightness(1.04);}
  .day-bar-col.selected .day-bar{width:100%;background:var(--brown-deep);}
  @keyframes barGrow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  .day-bar-labels{display:flex;gap:3px;padding:6px 3px 0 5px;}
  .day-bar-labels span{
    flex:1;min-width:2px;text-align:center;
    font-size:8px;font-weight:700;color:var(--ink-soft);
    opacity:0;
  }
  .day-bar-labels span:first-child,.day-bar-labels span:nth-child(5n),.day-bar-labels span:last-child{opacity:.85;}

  .top5-title{
    margin:0 0 14px;
    font-family:var(--font-display);font-weight:850;font-size:27px;
    color:var(--brown-deep);letter-spacing:.015em;text-transform:uppercase;
  }
  .top5-row{
    min-width:0;
    display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:16px;
    padding:7px 0;border-bottom:1px solid rgba(87,42,7,.09);
  }
  .top5-row:last-child{border-bottom:0;}
  .top5-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700;color:var(--brown-deep);text-transform:lowercase;}
  .top5-amt{font-size:12px;font-style:italic;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}

  /* ================= КАЛЕНДАРЬ + ДИАГРАММА ================= */
  .cal-donut-wrap{padding:20px 24px 8px;}
  .cal-donut-row{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:center;
    padding:22px;
    border:1px solid rgba(255,255,255,.34);
    border-radius:20px;
    background:rgba(246,241,229,.58);
    box-shadow:var(--shadow-sm);
    backdrop-filter:blur(5px);
  }
  #calendar-card,#pie-card{min-width:0;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:7px;}
  .cal-weekdays span{text-align:center;font-size:8px;font-weight:800;color:rgba(87,42,7,.55);letter-spacing:.055em;text-transform:uppercase;}
  .cal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
  .cal-day{
    aspect-ratio:1;
    min-width:0;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(87,42,7,.14);
    border-radius:9px;
    background:rgba(122,61,10,.12);
    color:var(--brown-deep);
    cursor:pointer;
    font-size:12px;font-weight:750;
    transition:transform .15s var(--spring),background .15s ease,border-color .15s ease,color .15s ease;
  }
  .cal-day:hover{transform:translateY(-1px);background:rgba(122,61,10,.18);border-color:rgba(87,42,7,.23);}
  .cal-day.empty{visibility:hidden;cursor:default;}
  .cal-day.no-expense{background:rgba(246,241,229,.45);color:rgba(87,42,7,.50);}
  .cal-day.selected{background:var(--brown-deep)!important;border-color:var(--brown-deep)!important;color:var(--cream-text)!important;box-shadow:0 4px 12px rgba(87,42,7,.18);}
  .cal-day.today:not(.selected){box-shadow:inset 0 0 0 1.5px var(--brown);}

  .donut-col{display:flex;flex-direction:column;align-items:center;min-width:0;}
  .donut-row{width:100%;display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;justify-content:center;gap:22px;}
  .donut-svg-wrap{position:relative;width:150px;height:150px;flex-shrink:0;}
  .donut-svg-wrap::after{content:"";position:absolute;inset:39px;border-radius:50%;background:rgba(246,241,229,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.34);pointer-events:none;}
  .donut-svg-wrap svg{animation:donutIn .4s var(--spring) both;}
  @keyframes donutIn{from{opacity:0;transform:scale(.92) rotate(-7deg);}to{opacity:1;transform:scale(1) rotate(0);}}
  .donut-total{margin-top:8px;text-align:center;font-family:var(--font-head);font-weight:850;font-size:24px;color:var(--brown-deep);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .donut-total::after{content:" итого";font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .pie-legend{min-width:0;width:100%;}
  .pie-legend-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:12px;padding:5px 0;}
  .pie-legend-name{min-width:0;display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:700;color:var(--brown-deep);text-transform:lowercase;}
  .pie-legend-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;box-shadow:0 0 0 1px rgba(87,42,7,.08);}
  .pie-legend-amt{font-size:11.5px;font-style:italic;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .pie-empty{padding:28px 12px;text-align:center;color:var(--ink-soft);font-size:13px;font-style:italic;}

  /* ================= БЮДЖЕТ ================= */
  .budget-wrap{
    margin:10px 24px 8px;
    padding:14px 16px;
    border:1px solid rgba(255,255,255,.3);
    border-radius:16px;
    background:rgba(246,241,229,.6);
    cursor:pointer;
    box-shadow:0 4px 14px rgba(65,43,24,.07);
    transition:transform .15s ease,background .15s ease;
  }
  .budget-wrap:hover{transform:translateY(-1px);background:rgba(246,241,229,.72);}
  .budget-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px;}
  .budget-label{font-size:9.5px;font-weight:800;color:var(--ink-soft);letter-spacing:.07em;text-transform:uppercase;}
  .budget-nums{font-size:12px;font-weight:700;color:var(--brown-deep);font-variant-numeric:tabular-nums;text-align:right;}
  .budget-track{height:7px;overflow:hidden;border-radius:5px;background:rgba(122,61,10,.12);}
  .budget-fill{height:100%;width:0;border-radius:5px;transition:width .75s var(--ease),background .3s ease;}
  .budget-fill.ok{background:linear-gradient(90deg,#7C9473,#A7C39D);}
  .budget-fill.warn{background:linear-gradient(90deg,var(--tan),#E4C793);}
  .budget-fill.over{background:linear-gradient(90deg,var(--rust),#D27B60);}
  .budget-note{margin-top:7px;font-size:10.5px;color:var(--ink-soft);}
  .budget-note.over{color:var(--rust);font-weight:650;}
  .budget-empty{font-size:12px;color:var(--ink-soft);font-style:italic;}

  /* ================= ПОИСК + СПИСОК ================= */
  .tape-wrap{padding:8px 24px 0;}
  .tape-toolbar{display:flex;align-items:center;gap:8px;margin:8px 0 10px;}
  .search-input{
    width:100%;min-width:0;
    padding:11px 14px;
    border:1px solid rgba(87,42,7,.12);
    border-radius:14px;
    outline:0;
    background:rgba(246,241,229,.62);
    color:var(--brown-deep);
    font-size:12.5px;
    transition:border-color .15s ease,background .15s ease,box-shadow .15s ease;
  }
  .search-input:focus{border-color:rgba(122,61,10,.38);background:rgba(246,241,229,.78);box-shadow:0 0 0 3px rgba(122,61,10,.07);}
  .search-input::placeholder{color:var(--ink-soft);opacity:.72;}
  .search-clear{width:36px;height:36px;flex:0 0 36px;border:1px solid rgba(87,42,7,.12);border-radius:12px;background:rgba(246,241,229,.66);color:var(--brown);cursor:pointer;}
  .search-count{margin:3px 4px 10px;font-size:10.5px;color:var(--ink-soft);font-style:italic;}
  .swipe-hint{text-align:center;font-size:9.5px;color:rgba(74,42,12,.38);margin:5px 0 3px;letter-spacing:.035em;}
  .tape{display:flex;flex-direction:column;gap:8px;}
  .day-group{margin-bottom:8px;}
  .day-label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:14px 4px 7px;font-size:10px;font-weight:800;color:var(--brown-deep);letter-spacing:.055em;text-transform:uppercase;}
  .day-total-amt{font-size:11.5px;font-weight:700;font-style:italic;color:var(--brown);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .day-detail-header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:6px 0 10px;}
  .back-to-month{padding:8px 10px;border:1px solid rgba(87,42,7,.18);border-radius:10px;background:rgba(246,241,229,.44);color:var(--brown);font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  @keyframes riseIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
  .receipt{
    position:relative;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:center;
    gap:16px;
    min-height:58px;
    padding:11px 14px 11px 16px;
    border:1px solid rgba(87,42,7,.09);
    border-radius:15px;
    background:rgba(232,225,208,.88);
    box-shadow:0 3px 11px rgba(65,43,24,.05);
    cursor:pointer;
    animation:riseIn .28s var(--ease) both;
    transition:background .15s ease,transform .15s var(--ease),box-shadow .15s ease;
  }
  .receipt:hover{background:rgba(246,241,229,.82);transform:translateY(-1px);box-shadow:0 6px 15px rgba(65,43,24,.07);}
  .receipt::before,.receipt-dot{display:none;}
  .receipt-main{min-width:0;}
  .receipt-cat{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:750;color:var(--brown-deep);text-transform:lowercase;}
  .receipt-note{margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;color:var(--ink-soft);}
  .receipt-tail{
    min-width:215px;
    display:grid;
    grid-template-columns:minmax(92px,1fr) auto;
    align-items:center;
    gap:16px;
    padding-left:16px;
    border-left:1px solid rgba(87,42,7,.13);
    background:transparent;
    border-radius:0;
  }
  .receipt-member{min-width:0;overflow-wrap:anywhere;font-size:10.5px;font-weight:800;color:var(--brown-deep);line-height:1.15;text-transform:uppercase;letter-spacing:.025em;text-align:left;}
  .receipt-amount{font-size:12.5px;font-style:italic;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;}
  .empty-tape{padding:28px 18px;border:1px dashed rgba(87,42,7,.16);border-radius:16px;background:rgba(246,241,229,.46);text-align:center;color:var(--ink-soft);font-size:12.5px;font-style:italic;line-height:1.55;}

  /* ================= ПЛАВАЮЩИЕ КНОПКИ ================= */
  .profile-fab,.fab{
    position:fixed;bottom:24px;
    width:54px;height:54px;
    display:flex;align-items:center;justify-content:center;
    padding:0;
    border:1px solid rgba(87,42,7,.14);
    border-radius:16px;
    background:rgba(246,241,229,.96);
    color:var(--brown);
    cursor:pointer;
    box-shadow:0 10px 28px rgba(65,43,24,.18);
    transition:transform .2s var(--spring),box-shadow .2s ease,background .2s ease;
    z-index:30;
  }
  .profile-fab{left:max(20px,calc((100vw - 1180px)/2 + 20px));}
  .fab{right:max(20px,calc((100vw - 1180px)/2 + 20px));}
  .profile-fab:hover,.fab:hover{transform:translateY(-2px);background:#fff8ea;box-shadow:0 14px 30px rgba(65,43,24,.22);}
  .profile-fab:active,.fab:active{transform:scale(.95);}
  .profile-fab svg,.fab svg{width:27px;height:27px;}
  .profile-fab svg circle{fill:var(--brown)!important;}
  .profile-fab svg path{stroke:var(--brown)!important;}
  .fab svg path{fill:var(--brown)!important;}
  .fab svg{transition:transform .24s var(--spring);}
  .fab:hover svg{transform:scale(1.08);}
  button:focus-visible,input:focus-visible{outline:2px solid rgba(87,42,7,.72);outline-offset:3px;}

  /* ================= МОДАЛЬНЫЕ ОКНА ================= */
  .overlay{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    padding:18px;
    background:rgba(45,38,29,.42);
    backdrop-filter:blur(8px) saturate(.9);
    animation:fadeIn .16s var(--ease) both;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes modalPop{from{opacity:0;transform:scale(.97) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal{
    width:min(460px,100%);
    max-height:min(90vh,760px);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:26px 28px 22px;
    border:1px solid rgba(87,42,7,.14);
    border-radius:22px;
    background:var(--cream-soft);
    color:var(--ink);
    box-shadow:0 24px 58px rgba(45,32,19,.28);
    animation:modalPop .24s var(--ease) both;
    scrollbar-width:thin;
    scrollbar-color:rgba(122,61,10,.30) transparent;
  }
  .modal h2{margin:0 0 18px;text-align:center;font-family:var(--font-display);font-weight:850;font-size:27px;line-height:1.05;letter-spacing:.015em;color:var(--brown-deep);text-transform:uppercase;}
  .modal label{display:block;margin:16px 0 7px;text-align:left;font-family:var(--font-body);font-size:10px;font-weight:800;letter-spacing:.07em;color:var(--ink-soft);text-transform:uppercase;}
  .amount-input{width:100%;padding:2px 0 9px;border:0;border-bottom:1.5px solid var(--brown);outline:0;background:transparent;color:var(--brown-deep);text-align:center;font-family:var(--font-head);font-size:34px;font-weight:850;letter-spacing:-.04em;font-variant-numeric:tabular-nums;}
  .modal input[type=text],.modal input[type=date]{width:100%;min-height:43px;padding:10px 13px;border:1px solid rgba(87,42,7,.28);border-radius:12px;outline:0;background:rgba(255,255,255,.20);color:var(--brown-deep);font-family:var(--font-body);font-size:13px;transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;}
  .modal input[type=text]:focus,.modal input[type=date]:focus{border-color:rgba(122,61,10,.58);background:rgba(255,255,255,.32);box-shadow:0 0 0 3px rgba(122,61,10,.07);}
  .modal input[type=text]::placeholder{color:var(--ink-soft);opacity:.58;}
  .quick-amounts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 2px;}
  .quick-amt{padding:6px 10px;border:1px solid rgba(87,42,7,.24);border-radius:10px;background:rgba(255,255,255,.15);color:var(--brown);font-size:10.5px;font-weight:750;cursor:pointer;transition:background .15s ease,color .15s ease,transform .15s ease;}
  .quick-amt:hover{background:var(--brown);color:var(--cream-text);transform:translateY(-1px);}
  .label-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 7px;}
  .label-row label{margin:0;}
  .manage-cats-link{padding:0;border:0;background:none;color:var(--brown);cursor:pointer;font-family:var(--font-body);font-size:9.5px;font-weight:750;letter-spacing:.035em;text-decoration:none;text-transform:uppercase;}
  .manage-cats-link:hover{text-decoration:underline;}
  .chip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:176px;overflow-y:auto;padding:1px;}
  .chip{min-width:0;min-height:36px;padding:8px 9px;border:1px solid rgba(87,42,7,.28);border-radius:11px;background:rgba(122,61,10,.07);color:var(--brown-deep);display:flex;align-items:center;justify-content:center;gap:5px;text-align:center;font-size:10px;font-weight:750;line-height:1.15;text-transform:uppercase;letter-spacing:.025em;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease,transform .15s ease;}
  .chip:hover{transform:translateY(-1px);border-color:rgba(87,42,7,.5);}
  .chip.selected{background:var(--brown);border-color:var(--brown);color:var(--cream-text);box-shadow:none;}
  .chip-dot{display:none;}
  .add-cat-chip{background:transparent;color:var(--brown);border-style:dashed;}
  .member-seg{display:block;margin-top:14px!important;overflow:hidden;}
  .member-seg-inner{display:flex;align-items:stretch;gap:4px;max-width:100%;overflow-x:auto;padding:4px;border:1px solid rgba(87,42,7,.16);border-radius:13px;background:rgba(122,61,10,.05);scrollbar-width:none;}
  .member-seg-inner::-webkit-scrollbar{display:none;}
  .member-seg .chip{flex:0 0 auto;max-width:none;min-height:34px;padding:8px 12px;border:0;border-radius:9px;background:transparent;color:var(--brown-deep);white-space:nowrap;}
  .member-seg .chip.selected{background:var(--brown);color:var(--cream-text);}
  .modal-actions{position:sticky;bottom:-22px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:24px -4px -4px;padding:14px 4px 4px;background:linear-gradient(to bottom,rgba(246,241,229,0),var(--cream-soft) 24%);z-index:3;}
  .btn{min-height:44px;padding:10px 14px;border:1px solid var(--brown);border-radius:12px;font-family:var(--font-display);font-size:15px;font-weight:750;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;transition:transform .15s var(--ease),filter .15s ease,box-shadow .15s ease;}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.03);}
  .btn-primary{background:var(--brown);color:var(--cream-text);box-shadow:0 5px 12px rgba(87,42,7,.13);}
  .btn-secondary{background:transparent;color:var(--brown-deep);}
  .btn-danger{background:var(--rust);border-color:var(--rust);color:#fff;}
  .modal-error{min-height:16px;margin-top:10px;text-align:center;color:var(--rust);font-size:11.5px;}
  .btn[disabled]{opacity:.58;cursor:default;pointer-events:none;}
  .btn.loading{position:relative;color:transparent!important;}
  .btn.loading::after{content:"";position:absolute;top:50%;left:50%;width:15px;height:15px;margin:-8px 0 0 -8px;border:2px solid rgba(245,238,220,.4);border-top-color:var(--cream-text);border-radius:50%;animation:spin .6s linear infinite;}
  .btn-secondary.loading::after{border-color:rgba(122,61,10,.3);border-top-color:var(--brown);}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* профиль */
  .profile-avatar-preview{width:88px;height:88px;margin:0 auto 12px;border-radius:22px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--cream-text);font-family:var(--font-head);font-size:30px;font-weight:850;box-shadow:0 8px 20px rgba(65,43,24,.12);}
  .photo-upload-btn{display:block!important;margin:0 0 4px!important;text-align:center!important;color:var(--brown)!important;font-family:var(--font-body)!important;font-size:10.5px!important;font-weight:800!important;letter-spacing:.045em!important;cursor:pointer;}
  .rgb-color-row{display:flex;align-items:center;justify-content:center;gap:10px;}
  .rgb-color-input{width:46px;height:38px;padding:2px;border:1px solid rgba(87,42,7,.35);border-radius:10px;background:none;cursor:pointer;}
  .rgb-color-hex{font-size:12px;color:var(--ink-soft);}
  .animated-toggle-row{display:flex;align-items:center;justify-content:center;gap:12px;}
  .switch{position:relative;width:46px;height:26px;flex-shrink:0;}
  .switch input{width:0;height:0;opacity:0;}
  .switch-track{position:absolute;inset:0;border-radius:999px;background:rgba(122,61,10,.23);cursor:pointer;transition:background .15s ease;}
  .switch-track::before{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s var(--spring);}
  .switch input:checked + .switch-track{background:var(--brown);}
  .switch input:checked + .switch-track::before{transform:translateX(20px);}
  .animated-preview-label{margin-top:10px;text-align:center;color:var(--ink-soft);font-size:12px;}
  .color-pick{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px;}
  .color-swatch{width:28px;height:28px;border:2px solid transparent;border-radius:9px;cursor:pointer;}
  .color-swatch.selected{border-color:var(--brown-deep);box-shadow:0 0 0 2px rgba(87,42,7,.08);}
  .onboard-name-input{width:100%;min-height:43px;margin-top:6px;padding:10px 13px;border:1px solid rgba(87,42,7,.28);border-radius:12px;background:rgba(255,255,255,.25);color:var(--brown-deep);font-size:13px;}
  .style-dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--ink-soft);}
  .style-dot.gold{background:linear-gradient(135deg,#8D5B16,#E3BD63);}.style-dot.blue{background:linear-gradient(135deg,#355E91,#88B4D7);}.style-dot.red{background:linear-gradient(135deg,#8E332E,#D77A65);}.style-dot.teal{background:linear-gradient(135deg,#386D69,#85B8AD);}.style-dot.silver{background:linear-gradient(135deg,#72777E,#D8D9D7);}.style-dot.none{background:#9F9385;}
  @keyframes shimmer-flow{
    0%{background-position:0% 50%;}
    100%{background-position:200% 50%;}
  }
  .name-shimmer{
    display:inline-block;
    max-width:100%;
    /* Shift by exactly one repeated tile: the first and last frames match. */
    background-color:var(--brown);
    background-size:200% 100%;
    background-repeat:repeat-x;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    animation:shimmer-flow 3.2s linear infinite;
    font-weight:800;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,.08));
    will-change:background-position;
  }
  .shimmer-warm,.shimmer-gold{background-image:linear-gradient(90deg,#6a3508 0%,#6a3508 12%,#9a5b1f 24%,#f0d89a 43%,#fff0bc 49%,#c68d3d 57%,#7a3d0a 78%,#6a3508 88%,#6a3508 100%);}
  .shimmer-blue{background-image:linear-gradient(90deg,#31577f 0%,#31577f 12%,#6f9ec5 28%,#d9edf6 48%,#8fc4dd 57%,#355E91 78%,#31577f 88%,#31577f 100%);}
  .shimmer-red{background-image:linear-gradient(90deg,#7a2c28 0%,#7a2c28 12%,#b84c40 28%,#f3c0a9 48%,#dc806b 58%,#8E332E 79%,#7a2c28 88%,#7a2c28 100%);}
  .shimmer-teal{background-image:linear-gradient(90deg,#2f615d 0%,#2f615d 12%,#5c9a90 28%,#d2eee7 48%,#88c4b6 58%,#386D69 79%,#2f615d 88%,#2f615d 100%);}
  .shimmer-silver{background-image:linear-gradient(90deg,#555d64 0%,#555d64 12%,#8d949a 28%,#f7f7f2 48%,#c8ccce 58%,#656b73 79%,#555d64 88%,#555d64 100%);}
  .member-chip.active .name-shimmer{background-image:linear-gradient(90deg,#f7e5b5 0%,#f7e5b5 12%,#fffaf0 34%,#d9ae67 49%,#fffdf6 60%,#f4dfad 78%,#f7e5b5 88%,#f7e5b5 100%);}
  .member-chip .name-shimmer{white-space:nowrap;}
  .receipt-member .name-shimmer{white-space:normal;overflow-wrap:anywhere;}

  /* категории */
  .cat-manage-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(87,42,7,.10);}
  .cat-manage-row:last-child{border-bottom:0;}
  .cat-manage-dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;}
  .cat-manage-name{flex:1;min-width:0;padding:7px 8px;border:1px solid transparent;border-radius:9px;outline:0;background:transparent;color:var(--brown-deep);font-family:var(--font-body);font-size:13px;}
  .cat-manage-name:focus{border-color:rgba(122,61,10,.35);background:rgba(255,255,255,.22);}
  .cat-del-btn{padding:5px 7px;border:0;border-radius:8px;background:transparent;color:var(--rust);cursor:pointer;font-size:14px;}
  .cat-add-row{display:flex;gap:8px;margin-top:14px;}.cat-add-row input{flex:1;min-width:0;}.cat-add-row .btn{flex:0 0 auto;min-height:40px;padding:9px 13px;font-size:12px;}

  /* уведомления / служебное */
  .toast{position:fixed;left:50%;bottom:26px;z-index:60;transform:translateX(-50%) translateY(12px);max-width:min(90vw,460px);padding:10px 16px;border-radius:12px;background:var(--brown-deep);color:var(--cream-text);box-shadow:0 10px 25px rgba(50,28,6,.25);font-size:12px;opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--spring);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.with-action{display:flex;align-items:center;pointer-events:auto;}
  .toast-undo{margin-left:12px;padding:0;border:0;background:transparent;color:var(--tan);font-family:var(--font-body);font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer;pointer-events:auto;}
  .offline-banner{position:fixed;top:0;left:0;right:0;z-index:70;transform:translateY(-100%);padding:7px 12px;background:var(--rust);color:#fff;text-align:center;font-size:12px;transition:transform .22s var(--ease);}.offline-banner.show{transform:translateY(0);}
  .offline-banner button{margin-left:8px;border:1px solid rgba(255,255,255,.6);border-radius:6px;background:transparent;color:inherit;cursor:pointer;font-size:11px;}
  .loading-note{padding:24px;text-align:center;color:var(--ink-soft);font-size:12px;font-style:italic;}
  .setup-box{max-width:560px;margin:60px auto;padding:24px;border-radius:18px;background:var(--cream-soft);line-height:1.6;box-shadow:var(--shadow-sm);}.setup-box h2{font-family:var(--font-display);color:var(--brown-deep);}.setup-box code{padding:2px 6px;border-radius:5px;background:rgba(122,61,10,.10);font-size:12px;}

  /* ================= АНАЛИТИКА ================= */
  @keyframes sectionRise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .analytics-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:4px 24px 0;}
  .analytics-section{min-width:0;margin:0;padding:20px;border:1px solid rgba(255,255,255,.32);border-radius:18px;background:rgba(246,241,229,.62);box-shadow:var(--shadow-sm);animation:sectionRise .35s var(--ease) both;}
  .analytics-section h3{margin:0 0 15px;font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--brown-deep);letter-spacing:.015em;text-transform:none;}
  .period-toggle{width:fit-content;margin:4px 24px 14px;padding:4px;display:flex;gap:2px;border:1px solid rgba(255,255,255,.3);border-radius:14px;background:rgba(246,241,229,.66);}
  .period-toggle button{min-height:34px;padding:7px 15px;border:0;border-radius:10px;background:transparent;color:var(--brown);cursor:pointer;font-family:var(--font-body);font-size:10.5px;font-weight:800;letter-spacing:.045em;text-transform:uppercase;}.period-toggle button.active{background:var(--brown);color:var(--cream-text);}
  .compare-metric{margin-bottom:16px;animation:sectionRise .4s var(--ease) both;}.compare-metric:last-child{margin-bottom:0;}
  .compare-metric-label{margin-bottom:4px;font-size:9.5px;font-weight:800;color:var(--ink-soft);letter-spacing:.055em;text-transform:uppercase;}
  .compare-metric-value{font-family:var(--font-head);font-size:22px;font-weight:850;color:var(--brown-deep);font-variant-numeric:tabular-nums;letter-spacing:-.025em;}
  .compare-metric-sub{margin-top:4px;color:var(--ink-soft);font-size:11px;font-style:italic;}
  .change-badge{display:inline-flex;align-items:center;margin-left:7px;padding:3px 7px;border-radius:8px;font-size:10px;font-weight:800;vertical-align:middle;animation:badgePop .32s var(--spring) both;}@keyframes badgePop{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:scale(1);}}
  .change-up{background:rgba(168,68,44,.13);color:var(--rust);}.change-down{background:rgba(124,148,115,.22);color:#486744;}.change-flat{background:rgba(122,61,10,.08);color:var(--ink-soft);}

async function fetchWithTimeout(input, options = {}){
  const controller = new AbortController();
  const signal = options.signal || (input instanceof Request ? input.signal : null);
  const abort = () => controller.abort();
  const endpoint = new URL(typeof input === 'string' ? input : input.url).pathname;
  if(signal?.aborted) abort();
  else signal?.addEventListener('abort', abort, {once:true});
  const timer = setTimeout(abort, REQUEST_TIMEOUT_MS);
  try {
    const response = await fetch(input, {...options, signal:controller.signal});
    // Keep the timeout active while downloading the response body, too.
    await response.clone().arrayBuffer();
    if(response.ok) connectionFailures.delete(endpoint);
    else if(response.status >= 500) connectionFailures.add(endpoint);
    return response;
  } catch(error) {
    if(!signal?.aborted) connectionFailures.add(endpoint);
    throw error;
  } finally {
    clearTimeout(timer);
    signal?.removeEventListener('abort', abort);
    updateOnlineStatus();
  }
}

function resizeImageToDataUrl(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('image failed'));
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = maxSize; canvas.height = maxSize;
        const ctx = canvas.getContext('2d');
        const side = Math.min(img.width, img.height);
        const sx = (img.width-side)/2, sy = (img.height-side)/2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

      const expenses = rows.map(r => ({id:r.id, amount:Number(r.amount), categoryId:r.category_id,
        memberId:r.member_id, note:r.note, date:r.date, createdAt:Number(r.created_at)}));
      // A response started before a write must not overwrite newer cached data.
      if(generation !== expenseCacheGeneration) return null;
      expenseCache[key] = {savedAt:Date.now(), rows:expenses};
      validatedRanges.add(key);
      persistExpenses();
      return expenses;
    })().finally(() => expenseRequests.delete(requestKey));
    expenseRequests.set(requestKey, request);
  }
  const rows = await expenseRequests.get(requestKey);
  return rows === null ? null : filterExpenses(rows, memberId);
}

function categoryById(id){ return state.categories.find(c=>c.id===id) || {name:'Другое', color:'var(--cat-7)'}; }
function memberById(id){ return state.members.find(m=>m.id===id); }
function resolveColor(c){
  if(c && typeof c === 'string' && c.startsWith('var(')) return CAT_COLOR_MAP[c] || '#6B7280';
  return c;
}
function pickCategoryColor(){
  const used = new Set(state.categories.map(c=>resolveColor(c.color)));
  for(const c of CAT_COLORS){
    if(!used.has(resolveColor(c))) return c;
  }
  // все базовые цвета заняты — генерируем следующий по кругу оттенков, не повторяя уже использованные
  let hue = (state.categories.length * 47) % 360;
  let hslColor = `hsl(${hue}, 55%, 55%)`;
  let guard = 0;
  while(used.has(hslColor) && guard < 20){
    hue = (hue + 47) % 360;
    hslColor = `hsl(${hue}, 55%, 55%)`;
    guard++;
  }
  return hslColor;
}

function monthRange(year, month){
  return {start: new Date(year, month, 1), end: new Date(year, month+1, 0)};
}
function yearRange(year){
  return {start: new Date(year, 0, 1), end: new Date(year, 11, 31)};
}
function startOfWeekDate(d){
  const day = d.getDay();
  const diff = (day===0 ? -6 : 1-day);
  const r = new Date(d); r.setDate(d.getDate()+diff); r.setHours(0,0,0,0);
  return r;
}
function currentWeekRange(offset){
  offset = offset || 0;
  const base = new Date(); base.setDate(base.getDate() + offset*7);
  const start = startOfWeekDate(base);
  const end = new Date(start); end.setDate(start.getDate()+6);
  return {start, end};
}
function currentMonthRangeReal(offset){
  offset = offset || 0;
  const t = new Date();
  let y = t.getFullYear(), m = t.getMonth()+offset;
  while(m<0){ m+=12; y-=1; } while(m>11){ m-=12; y+=1; }
  return monthRange(y, m);
}
function sumByCategoryMap(expenses){
  const map = {};
  expenses.forEach(e=>{ map[e.categoryId] = (map[e.categoryId]||0) + e.amount; });
  return map;
}
function topCategoryOf(expenses){
  const map = sumByCategoryMap(expenses);
  let best = null;
  Object.entries(map).forEach(([id, amt])=>{ if(!best || amt>best.amt) best = {id, amt}; });
  return best;
}
function periodStats(expenses, dayCount){
  const total = expenses.reduce((s,e)=>s+e.amount,0);
  return { total, avgPerDay: dayCount>0 ? total/dayCount : 0, topCategory: topCategoryOf(expenses) };
}
function changeInfo(current, previous){
  const diff = current - previous;
  let pct = null;
  if(previous !== 0) pct = (diff/previous)*100;
  else if(current !== 0) pct = 100;
  let cls = 'change-flat', sign = '';
  if(diff > 0.5){ cls = 'change-up'; sign = '+'; }
  else if(diff < -0.5){ cls = 'change-down'; sign = '−'; }
  return {diff, pct, cls, sign};
}

async function refreshData(force = false){
  const requestId = ++homeRequestId;
  const range = monthRange(state.selectedYear, state.selectedMonth);
  const start = toDateStr(range.start), end = toDateStr(range.end);
  const memberId = state.filterMemberId;
  const cached = cachedExpenses(start, end, memberId);
  if(cached !== null) renderMonthData(cached);
  const expenses = await fetchExpensesRange(start, end, memberId, force);
  if(requestId !== homeRequestId || state.currentPage !== 'home') return;
  if(expenses !== null){ renderMonthData(expenses); return; }
  if(cached !== null) return;
  document.getElementById('oil-number').textContent = '—';
  ['day-bars','top5-list','calendar-card','pie-card','tape'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.innerHTML = '<div class="loading-note">Не удалось загрузить траты. Проверьте соединение и нажмите «Повторить».</div>';
  });
  document.getElementById('tape').insertAdjacentHTML('beforeend', '<button class="btn btn-secondary" id="retry-expenses">Повторить</button>');
  document.getElementById('retry-expenses').addEventListener('click', () => refreshData(true));
}

function renderDayBarChart(){
  const el = document.getElementById('day-bars');
  const labelsEl = document.getElementById('day-bar-labels');
  const head = document.getElementById('daychart-head');
  if(!el) return;
  const daysInMonth = monthRange(state.selectedYear, state.selectedMonth).end.getDate();
  const byDay = {};
  state.monthExpenses.forEach(e=>{ byDay[e.date] = (byDay[e.date]||0) + e.amount; });
  const max = Math.max(...Object.values(byDay), 1);
  let bars = '', labels = '';
  for(let d=1; d<=daysInMonth; d++){
    const ds = state.selectedYear+'-'+pad(state.selectedMonth+1)+'-'+pad(d);
    const val = byDay[ds] || 0;
    const h = val>0 ? Math.max(Math.round((val/max)*100),3) : 0.5;
    const sel = state.selectedDay===ds ? 'selected' : '';
    bars += `<div class="day-bar-col ${sel}" data-day="${ds}"><div class="day-bar" style="height:${h}%; animation-delay:${(d*0.012).toFixed(3)}s;" title="${d}: ${fmtMoney(val)}"></div></div>`;
    labels += `<span>${d}</span>`;
  }
  el.innerHTML = bars;
  if(labelsEl) labelsEl.innerHTML = labels;
  if(head) head.innerHTML = state.selectedDay ? Math.round(byDay[state.selectedDay]||0).toLocaleString('ru-RU') : '&nbsp;';

  el.querySelectorAll('.day-bar-col').forEach(col=>{

function renderBudget(monthTotal){
  const el = document.getElementById('budget-section');
  if(!el) return;

  if(state.monthlyBudget === null || state.monthlyBudget === undefined || isNaN(state.monthlyBudget)){
    el.innerHTML = `<div class="budget-wrap" id="budget-wrap">
      <div class="budget-empty">Нажмите, чтобы задать бюджет на месяц</div>
    </div>`;
  } else {
    const budget = state.monthlyBudget;
    const pct = budget>0 ? (monthTotal/budget)*100 : 0;
    const cls = pct>100 ? 'over' : (pct>=80 ? 'warn' : 'ok');
    const left = budget - monthTotal;

    // прогноз: актуален только для текущего месяца
    const now = new Date();
    const isCurrentMonth = now.getFullYear()===state.selectedYear && now.getMonth()===state.selectedMonth;
    const daysInMonth = monthRange(state.selectedYear, state.selectedMonth).end.getDate();
    let note;
    if(isCurrentMonth && now.getDate()>1 && monthTotal>0){
      const projected = (monthTotal/now.getDate())*daysInMonth;
      const overProjected = projected > budget;
      note = `<div class="budget-note ${overProjected?'over':''}">При таком темпе за месяц выйдет ≈ ${fmtMoney(projected)}${overProjected?' — выше бюджета':''}</div>`;
    } else if(left < 0){
      note = `<div class="budget-note over">Перерасход на ${fmtMoney(Math.abs(left))}</div>`;
    } else {
      note = `<div class="budget-note">Осталось ${fmtMoney(left)}</div>`;
    }

    el.innerHTML = `<div class="budget-wrap" id="budget-wrap">
      <div class="budget-top">
        <span class="budget-label">Бюджет месяца</span>
        <span class="budget-nums">${fmtMoney(monthTotal)} / ${fmtMoney(budget)} · ${Math.round(pct)}%</span>
      </div>
      <div class="budget-track"><div class="budget-fill ${cls}" id="budget-fill"></div></div>
      ${note}
    </div>`;
    requestAnimationFrame(()=>{
      const fill = document.getElementById('budget-fill');
      if(fill) fill.style.width = Math.min(pct, 100)+'%';
    });
  }

  const wrap = document.getElementById('budget-wrap');
  if(wrap) wrap.addEventListener('click', openBudgetModal);
}

function renderCalendar(){
  const el = document.getElementById('calendar-card');
  if(!el) return;
  const {selectedYear:y, selectedMonth:m} = state;
  const firstDay = new Date(y, m, 1);
  const daysInMonth = new Date(y, m+1, 0).getDate();
  let startOffset = firstDay.getDay() - 1;
  if(startOffset < 0) startOffset = 6;

  const byDay = {};
  state.monthExpenses.forEach(e=>{ byDay[e.date] = (byDay[e.date]||0) + e.amount; });
  const todayStr = toDateStr(new Date());

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = y+'-'+pad(m+1)+'-'+pad(d);
    const total = byDay[ds] || 0;
    const cls = [
      total>0 ? '' : 'no-expense',
      state.selectedDay===ds ? 'selected' : '',
      ds===todayStr ? 'today' : ''
    ].filter(Boolean).join(' ');
    cells += `<div class="cal-day ${cls}" data-day="${ds}" title="${total>0?fmtMoney(total):''}">${d}</div>`;
  }
  el.innerHTML = `
    <div class="cal-weekdays">${WEEKDAYS_SHORT.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-days">${cells}</div>
  `;
  el.querySelectorAll('.cal-day[data-day]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      const day = cell.getAttribute('data-day');
      state.selectedDay = state.selectedDay === day ? null : day;
      haptic(8);
      renderCalendar(); renderDayBarChart(); renderPieAndTape();
    });
  });
}

function currentScopeExpenses(){
  if(state.selectedDay) return state.monthExpenses.filter(e=>e.date===state.selectedDay);
  return state.monthExpenses;
}

function renderPieAndTape(){
  const expenses = currentScopeExpenses();
  renderPie(expenses);
  renderTape(expenses);
}

function rankColor(index, total){
  // самая крупная категория — тёмно-коричневая, самая мелкая — сливочная
  const dark = [0x5C,0x2E,0x06], light = [0xF0,0xE2,0xC4];
  const t = total>1 ? index/(total-1) : 0;
  return '#'+dark.map((d,i)=> Math.round(d + (light[i]-d)*t).toString(16).padStart(2,'0')).join('');
}

function renderPie(expenses){
  const el = document.getElementById('pie-card');
  if(!el) return;
  const total = expenses.reduce((s,e)=>s+e.amount,0);
  const byCat = {};
  expenses.forEach(e=>{ byCat[e.categoryId] = (byCat[e.categoryId]||0) + e.amount; });
  const rows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  if(rows.length===0){
    el.innerHTML = `<div class="pie-empty">Нет данных для диаграммы</div>`;
    return;
  }

  const r = 58, C = 2*Math.PI*r, cx=75, cy=75;
  let offset = 0;
  const circles = rows.map(([catId, amt], idx)=>{
    const color = rankColor(idx, rows.length);
    const dash = (amt/total)*C;
    const circle = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="26" stroke-linecap="butt" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-offset}" />`;
    offset += dash;
    return circle;
  }).join('');

  el.innerHTML = `
    <div class="donut-col">
      <div class="donut-row">
        <div class="donut-svg-wrap">
          <svg width="150" height="150" viewBox="0 0 150 150" style="transform:rotate(-90deg);">${circles}</svg>
        </div>
        <div class="pie-legend">
          ${rows.map(([catId, amt], idx)=>{
            const cat = categoryById(catId);
            return `<div class="pie-legend-row">
              <span class="pie-legend-name"><span class="pie-legend-dot" style="background:${rankColor(idx, rows.length)};"></span>${escapeHtml(cat.name)}</span>
              <span class="pie-legend-amt">${Math.round(amt).toLocaleString('ru-RU')}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="donut-total">${Math.round(total).toLocaleString('ru-RU')}</div>
    </div>
  `;
}

function applySearch(expenses){
  const q = (state.searchQuery||'').trim().toLowerCase();
  if(!q) return expenses;
  return expenses.filter(e=>{
    const cat = categoryById(e.categoryId);
    const m = memberById(e.memberId);
    return (cat.name||'').toLowerCase().includes(q)
      || (e.note||'').toLowerCase().includes(q)
      || (m && (m.name||'').toLowerCase().includes(q))
      || String(Math.round(e.amount)).includes(q);
  });
}

function renderTape(allExpenses){
  const el = document.getElementById('tape');
  if(!el) return;

  const expenses = applySearch(allExpenses);
  const searchInfo = (state.searchQuery||'').trim()
    ? `<div class="search-count">Найдено: ${expenses.length} · на сумму ${fmtMoney(expenses.reduce((s,e)=>s+e.amount,0))}</div>`
    : '';

  const dayTotal = state.selectedDay ? expenses.reduce((s,e)=>s+e.amount,0) : 0;
  const header = state.selectedDay ? `
    <div class="day-detail-header">
      <div style="display:flex;align-items:baseline;gap:10px;">
        <div class="day-label" style="margin:0;">${formatDateLong(state.selectedDay)}</div>
        <span class="day-total-amt">${fmtMoney(dayTotal)}</span>
      </div>
      <button class="back-to-month" id="back-to-month">← Показать весь месяц</button>
    </div>` : '';

  if(expenses.length===0){
    const emptyMsg = (state.searchQuery||'').trim()
      ? 'Ничего не найдено по этому запросу.'
      : 'Трат здесь ещё нет.<br>Нажмите «+», чтобы записать первую.';
    el.innerHTML = header + searchInfo + `<div class="empty-tape">${emptyMsg}</div>`;
    attachBackButton();
    return;
  }

  if(state.selectedDay){
    const items = expenses.slice().sort((a,b)=>b.createdAt-a.createdAt);
    el.innerHTML = header + searchInfo + renderReceiptList(items);
  } else {
    const byDay = {};
    expenses.forEach(e=>{ (byDay[e.date] = byDay[e.date]||[]).push(e); });
    const days = Object.keys(byDay).sort().reverse();
    el.innerHTML = header + searchInfo + days.map(date=>{
      const items = byDay[date].sort((a,b)=>b.createdAt-a.createdAt);
      const groupTotal = items.reduce((s,e)=>s+e.amount,0);
      return `<div class="day-group"><div class="day-label"><span>${formatDateLong(date)}</span><span class="day-total-amt">${fmtMoney(groupTotal)}</span></div>${renderReceiptList(items)}</div>`;
    }).join('');
  }

  el.querySelectorAll('.receipt').forEach(r=>{
    r.addEventListener('click', ()=>{
      const id = r.getAttribute('data-expense-id');
      const exp = state.monthExpenses.find(e=>e.id===id);
      if(exp) openEditExpense(exp);
    });
  });
  attachBackButton();
}

function attachBackButton(){
  const btn = document.getElementById('back-to-month');
  if(btn) btn.addEventListener('click', ()=>{ state.selectedDay = null; renderCalendar(); renderDayBarChart(); renderPieAndTape(); });
}

function renderReceiptList(items){
  return items.map(e=>{
    const cat = categoryById(e.categoryId);
    const m = memberById(e.memberId);
    return `<div class="receipt" data-expense-id="${e.id}">
      <div class="receipt-main">
        <div class="receipt-cat">${escapeHtml(cat.name)}</div>
        ${e.note ? `<div class="receipt-note">${escapeHtml(e.note)}</div>` : ''}
      </div>
      <div class="receipt-tail">
        <span class="receipt-member">${m ? memberNameHtml(m) : '—'}</span>
        <span class="receipt-amount">${Math.round(e.amount).toLocaleString('ru-RU')}</span>
      </div>
    </div>`;
  }).join('');
}

function formatDateLong(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.getDate()+' '+MONTHS_GENITIVE[d.getMonth()]+', '+WEEKDAYS[d.getDay()];
}

function shiftMonth(delta){
  state.selectedMonth += delta;
  while(state.selectedMonth < 0){ state.selectedMonth += 12; state.selectedYear -= 1; }
  while(state.selectedMonth > 11){ state.selectedMonth -= 12; state.selectedYear += 1; }
  state.selectedDay = null;
  haptic();
  renderApp();
}

function attachMainEvents(){
  attachTopbarEvents();
  document.getElementById('prev-year').addEventListener('click', ()=>{ state.selectedYear -= 1; state.selectedDay = null; haptic(); renderApp(); });
  document.getElementById('next-year').addEventListener('click', ()=>{ state.selectedYear += 1; state.selectedDay = null; haptic(); renderApp(); });
  document.getElementById('prev-month').addEventListener('click', ()=> shiftMonth(-1));
  document.getElementById('next-month').addEventListener('click', ()=> shiftMonth(1));
  document.getElementById('fab-add').addEventListener('click', ()=>{ haptic(); openAddExpense(); });
  // Поиск по тратам
  const search = document.getElementById('search-input');
  if(search){
    let searchTimer = null;
    search.addEventListener('input', (e)=>{
      state.searchQuery = e.target.value;
      if(searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(()=>{
        renderPieAndTape();
        const clear = document.getElementById('search-clear');
        const toolbar = document.querySelector('.tape-toolbar');
        if(state.searchQuery && !clear && toolbar){
          const btn = document.createElement('button');
          btn.className = 'search-clear'; btn.id = 'search-clear'; btn.textContent = '✕';
          btn.addEventListener('click', clearSearch);
          toolbar.appendChild(btn);
        } else if(!state.searchQuery && clear){
          clear.remove();
        }
      }, 180);
    });
  }
  const clearBtn = document.getElementById('search-clear');
  if(clearBtn) clearBtn.addEventListener('click', clearSearch);

  attachSwipeNavigation();
}

function clearSearch(){
  state.searchQuery = '';
  const input = document.getElementById('search-input');
  if(input) input.value = '';
  const clear = document.getElementById('search-clear');
  if(clear) clear.remove();
  renderPieAndTape();
}

let swipeAttached = false;
function attachSwipeNavigation(){
  const app = document.getElementById('app');
  if(!app || swipeAttached) return;
  swipeAttached = true;
  let startX = 0, startY = 0, tracking = false;
  app.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) { tracking = false; return; }
    const t = e.touches[0];
    // не перехватываем свайпы внутри полей ввода и горизонтально прокручиваемых блоков
    if(e.target.closest('input, textarea, .overlay, .chip-grid')) { tracking = false; return; }
    startX = t.clientX; startY = t.clientY; tracking = true;
  }, {passive:true});
  app.addEventListener('touchend', (e)=>{
    if(!tracking) return;
    tracking = false;
    if(state.currentPage !== 'home') return;      // свайп работает только в «Кассе»
    if(document.querySelector('.overlay')) return; // не мешаем открытым окнам
    const t = e.changedTouches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.8){
      shiftMonth(dx < 0 ? 1 : -1);
    }
  }, {passive:true});
}

  document.body.appendChild(overlay);
  let selectedMember = state.myMemberId;
  let saving = false;

  function renderCatChips(){
    const box = overlay.querySelector('#cat-chips');
    if(state.categories.length && !state.categories.some(c=>c.id===selectedCategory)){
      selectedCategory = state.categories[0].id;
    }
    box.innerHTML = state.categories.map(c=>
      `<div class="chip ${c.id===selectedCategory?'selected':''}" data-cat="${c.id}"><span class="chip-dot" style="background:${resolveColor(c.color)};"></span>${escapeHtml(c.name)}</div>`

        haptic(8);
      });
    });
  }
  renderCatChips();

  const amountInput = overlay.querySelector('#exp-amount');
  overlay.querySelectorAll('.quick-amt').forEach(b=>{
    b.addEventListener('click', ()=>{

      const cur = parseFloat(amountInput.value) || 0;
      amountInput.value = cur + add;
      haptic(8);
    });
  });

  overlay.querySelector('#manage-cats-link').addEventListener('click', ()=>{
    openCategoryManager(()=> renderCatChips());
  });

  overlay.querySelectorAll('#member-chips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      overlay.querySelectorAll('#member-chips .chip').forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected'); selectedMember = chip.getAttribute('data-mem');
      haptic(8);
    });
  });

  overlay.querySelector('#exp-cancel').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay && !saving) overlay.remove(); });

  overlay.querySelector('#exp-save').addEventListener('click', async ()=>{
    if(saving) return;
    const btn = overlay.querySelector('#exp-save');
    const amountVal = parseFloat(amountInput.value);
    const dateVal = overlay.querySelector('#exp-date').value;
    const noteVal = overlay.querySelector('#exp-note').value.trim();
    const errEl = overlay.querySelector('#exp-error');

    } else {

  });
  setTimeout(()=> amountInput.focus(), 50);
}
